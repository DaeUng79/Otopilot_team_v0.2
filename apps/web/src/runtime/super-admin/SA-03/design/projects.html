<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200)}
const stack=[];
function openLayer(el,focusSel){const sc=el.classList.contains('dlg')?$('#scrim2'):$('#scrim');stack.push({el,sc,from:document.activeElement});sc.classList.add('on');el.classList.add('on');
  setTimeout(()=>{const f=(focusSel&&$(focusSel,el))||el.querySelector('input:not([disabled]),select,button:not([disabled])');f&&f.focus()},60)}
function closeLayer(el){const i=stack.findIndex(l=>l.el===el);if(i<0)return;const l=stack.splice(i,1)[0];l.el.classList.remove('on');l.sc.classList.remove('on');
  if(l.from&&document.contains(l.from)&&l.from.focus)l.from.focus()}
document.addEventListener('keydown',e=>{
  if(!stack.length)return;const top=stack[stack.length-1].el;
  if(e.key==='Escape'){e.preventDefault();closeLayer(top)}
  if(e.key==='Tab'){const f=$$('input:not([disabled]),select,button:not([disabled]),[tabindex="0"]',top).filter(x=>x.offsetParent!==null||x===document.activeElement);
    if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
$('#scrim')&&$('#scrim').addEventListener('click',()=>{const l=stack.filter(x=>x.sc.id==='scrim').pop();l&&closeLayer(l.el)});
$('#scrim2')&&$('#scrim2').addEventListener('click',()=>{const l=stack.filter(x=>x.sc.id==='scrim2').pop();l&&closeLayer(l.el)});
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>closeLayer(b.closest('.drawer,.dlg'))));
$$('[data-href]').forEach(b=>b.addEventListener('click',()=>{location.href=b.dataset.href}));
function rowKey(tr,fn){tr.addEventListener('click',fn);tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}
function confirmDlg({title,body,ok,danger=true,withWhy=false,onOk}){const d=$('#dlg');$('#d-whyw').hidden=!withWhy;$('#dlg-t').textContent=title;$('#dlg-b').textContent=body;const b=$('#dlg-ok');b.textContent=ok;b.className='btn '+(danger?'danger':'primary');
  b.onclick=()=>{if(withWhy&&!$('#d-why').value.trim()){$('#d-why-e').textContent='삭제 사유를 적어 주세요';$('#d-why-e').hidden=false;$('#d-why').setAttribute('aria-invalid','true');$('#d-why').focus();return}closeLayer(d);onOk&&onOk()};openLayer(d,withWhy?'#d-why':'#dlg-cancel')}

 {id:1,name:'(가상) 통합 민원 시스템 구축 용역',dept:D[0],owner:'김가상',pos:'주무관',tel:'010-0000-2101',mail:'kim.gasang@gov.test',date:'2026-11-05',s:'준비',sub:0,N:5,doc:'wait',ev:'none'},

function list(){return P.filter(r=>(!fd||r.dept===fd)&&(!fs||r.s===fs)&&(!q||(r.name+r.owner).includes(q)))}
function render(keep){if(keep!==true)pg=1;const L=list();const pages=Math.max(1,Math.ceil(L.length/PS));if(pg>pages)pg=pages;const V=L.slice((pg-1)*PS,pg*PS);
  $('#count').textContent=L.length+'개 사업'+(L.length?' · '+pg+'/'+pages+'쪽':'');$('#none').hidden=L.length>0;$('table').hidden=!L.length;
  $('#rows').innerHTML=V.map(r=>`<tr tabindex="0" data-id="${r.id}" aria-label="${h(r.name)} 자세히 보기"><td class="strong nm">${locked(r)?'<span role="img" aria-label="잠김">🔒</span> ':''}${h(r.name)}${locked(r)?`<span class="lock">${lockMsg(r)}</span>`:''}</td><td>${h(r.dept)}</td><td>${h(r.owner)}</td><td class="tnum">${r.date}</td><td><span class="badge ${st[r.s]}">${mark[r.s]} ${r.s}</span></td><td class="num tnum">${r.sub}/${r.N}</td><td class="st2">${bd(DOCB,r.doc)}${bd(EVB,r.ev)}</td></tr>`).join('');

let cur=null;
function body(r,edit){
  const step=['준비','평가 중','완료'],ix=step.indexOf(r.s),L=locked(r);
  const fld=(id,lab,v,dis,type)=>`<label class="field">${lab}<input id="${id}" class="edit-in" ${type?'type="'+type+'" ':''}value="${h(v)}" ${dis?'disabled':''}></label>`;
  const info=edit?`${L?'<div class="note warn">평가가 시작돼 바꿀 수 없어요 (사업 식별·평가조건). 담당 정보만 고칠 수 있어요.</div>':''}${fld('x-name','사업명',r.name,L)}<div class="two">${fld('x-org','소속',r.org||'(가상)시청',L)}${fld('x-dept','부서',r.dept,true)}</div><div class="two">${fld('x-pos','직책/직급',r.pos)}${fld('x-owner','성명',r.owner)}</div>${fld('x-tel','전화',r.tel,false,'tel')}<label class="field"><span>이메일 <span class="hint">(선택)</span></span><input id="x-mail" class="edit-in" type="email" value="${h(r.mail||'')}"></label>${fld('x-date','평가일 (평가조건)',r.date,L,'date')}`
   :`<dl class="kv"><dt>사업명</dt><dd>${h(r.name)}</dd><dt>소속</dt><dd>${h(r.org||'(가상)시청')}</dd><dt>부서</dt><dd>${h(r.dept)}</dd><dt>직책/직급</dt><dd>${h(r.pos)}</dd><dt>성명</dt><dd>${h(r.owner)}</dd><dt>전화</dt><dd class="tnum">${r.tel}</dd><dt>이메일</dt><dd>${r.mail?h(r.mail):'<span class="muted" style="font-weight:400">없음</span>'}</dd><dt>평가일</dt><dd class="tnum">${r.date}</dd></dl>`;
  const H=(hist[r.id]||defHist(r)).map(x=>`<li><time>${x[0]}</time><div><b>${h(x[2])}</b><span>${h(x[1])}</span></div></li>`).join('');
  const lk=(t,ok)=>ok?`<a href="#" onclick="return false">${t}</a>`:`<span class="off">${t}</span>`;
  const resOk=r.ev==='ok'&&r.s==='완료',propOk=r.doc==='ok',rfpOk=!!r.rfp;
  const F=[['제안요청서',rfpOk,'제안요청서/'+(r.rfp?.filename||'rfp_v2.hwpx'),'제안요청서 (RFP)'],['업체별 제안서',propOk,'제안서/A사_제안서.pdf','A사 제안서'],['업체별 제안서',propOk,'제안서/B사_제안서.pdf','B사 제안서'],['업체별 제안서',propOk,'제안서/C사_제안서.pdf','C사 제안서'],['결과 보고서',resOk,'결과/평가결과_보고서.html','위원회 평가결과 보고서 (HTML)'],['결과 집계표',resOk,'결과/제안서평가_집계표.xlsx','제안서평가 집계표 (Excel)']];
  const nOk=F.filter(f=>f[1]).length,zip=r.name+'_자료.zip';
  const mats=edit?'':`<section class="dsec"><h3 class="sec-h"><span class="ic" aria-hidden="true">▤</span>자료 <span class="muted" style="font-weight:400;font-size:var(--t-base)">받을 수 있는 파일 ${nOk}개</span></h3>
   <div class="badges">${bd(DOCB,r.doc)}${bd(EVB,r.ev)}</div>
   <ul class="mats">${F.map(f=>`<li><div class="fi"><b>${f[3]}</b><small class="path">${h(r.name)}/${f[2]}</small></div>${f[1]?`<button class="btn dl" type="button" data-dl="${h(f[2])}" aria-label="${f[3]} 내려받기">내려받기</button>`:'<span class="badge">○ 아직 없음</span>'}</li>`).join('')}</ul>
   <button class="btn primary dl-all" type="button" data-dl="${h(zip)}" disabled title="전체 내려받기는 준비 중입니다">전체 내려받기 (ZIP)</button><p class="path zipn">${h(zip)}</p>
   <p class="lk-note">파일은 사업명 폴더로 정리돼요. 평가 중·완료 사업도 내려받기만 할 수 있어요(읽기 전용).</p></section>`;
  return `${L&&!edit?`<div class="lockbar"><span role="img" aria-label="잠김">🔒</span> ${lockMsg(r)} · 사업 식별·평가조건</div>`:''}
  <section class="dsec"><h3 class="sec-h"><span class="ic" aria-hidden="true">ⓘ</span>사업 정보</h3>${edit?'<div class="form">'+info+'</div>':info}</section>${mats}
  ${edit?'':`<section class="dsec"><h3 class="sec-h"><span class="ic" aria-hidden="true">➜</span>진행 단계</h3><ol class="steps">${step.map((s,i)=>`<li class="${i<ix?'done':i===ix?'now':''}"${i===ix?' aria-current="step"':''}>${i<ix?'✓ ':i===ix?'● ':''}${s}${i<ix?' (끝)':i===ix?' (지금)':''}</li>`).join('')}</ol>
   ${r.s==='평가 중'?`<p class="prog">점수 제출 <b class="tnum">${r.sub}/${r.N}</b>명</p>`:''}${r.s==='완료'?`<p class="prog">점수 제출 <b class="tnum">${r.sub}/${r.N}</b>명 · 결과 확인까지 끝났어요</p>`:''}</section>
  <section class="dsec"><h3 class="sec-h"><span class="ic" aria-hidden="true">↺</span>변경 이력</h3><ul class="hist">${H}</ul></section>`}`}
function foot(r,edit){
  if(edit)return '<button class="btn" type="button" id="b-cancel">취소</button><button class="btn primary" type="button" id="b-save">저장</button>';
  return '<button class="btn text-danger" type="button" id="b-del" style="margin-right:auto"'+(locked(r)?' disabled title="평가가 시작돼 삭제할 수 없어요"':'')+'>삭제</button><button class="btn primary" type="button" id="b-edit">수정</button>'}
function paint(r,edit){$('#p-t').textContent=edit?'사업 수정':r.name;$('#p-body').innerHTML=body(r,edit);$('#p-foot').innerHTML=foot(r,edit);
  const g=id=>document.getElementById(id);
  $$('#p-body [data-dl]').forEach(b=>b.onclick=()=>toast('내려받았어요 · '+b.dataset.dl));
  g('b-edit')&&(g('b-edit').onclick=()=>{paint(r,true);g('x-pos').focus()});
  g('b-cancel')&&(g('b-cancel').onclick=()=>paint(r,false));
  g('b-save')&&(g('b-save').onclick=()=>{const L=locked(r);if(!L){r.name=g('x-name').value.trim()||r.name;r.org=g('x-org').value.trim()||r.org;r.date=g('x-date').value||r.date}r.pos=g('x-pos').value.trim()||r.pos;r.owner=g('x-owner').value.trim()||r.owner;r.tel=g('x-tel').value.trim()||r.tel;r.mail=g('x-mail').value.trim();(hist[r.id]=hist[r.id]||defHist(r)).unshift([new Date().toISOString().slice(0,10),'총괄','사업 정보를 고쳤어요']);paint(r,false);render(true);toast('저장하고 기록을 남겼어요')});
  g('b-del')&&!g('b-del').disabled&&(g('b-del').onclick=()=>{$('#d-why').value='';$('#d-why-e').hidden=true;$('#d-why').removeAttribute('aria-invalid');
    confirmDlg({title:'‘'+r.name+'’을 삭제할까요?',body:'목록에서만 빠지고 기록은 남아요. 서명 자료는 보존돼요.',ok:'삭제',withWhy:true,onOk:()=>{P=P.filter(x=>x!==r);closeLayer($('#p'));render(true);toast('목록에서 뺐어요 · 서명 자료는 보존돼요')}})})}
function openP(id){cur=P.find(x=>x.id===id);paint(cur,false);openLayer($('#p'),'.x')}
const sh=(id,m)=>{const e=$('#'+id+'-e'),i=$('#'+id);e.textContent=m||'';e.hidden=!m;m?i.setAttribute('aria-invalid','true'):i.removeAttribute('aria-invalid');return !m};
$('#b-new').onclick=()=>{['n-name','n-owner','n-pos','n-tel','n-mail'].forEach(i=>{$('#'+i).value='';$('#'+i+'-e')&&sh(i,'')});$('#n-org').value='(가상)시청';
  $('#n-dept').innerHTML='<option value="">부서를 골라 주세요</option>'+D.map(d=>`<option>${d}</option>`).join('');['n-org','n-dept'].forEach(i=>sh(i,''));openLayer($('#pn'),'#n-name')};
$('#f-new').addEventListener('submit',e=>{e.preventDefault();
  const name=$('#n-name').value.trim(),org=$('#n-org').value.trim(),dept=$('#n-dept').value,owner=$('#n-owner').value.trim(),pos=$('#n-pos').value.trim(),tel=$('#n-tel').value.trim();
  const ok=[sh('n-name',name?'':'사업명을 적어 주세요'),sh('n-org',org?'':'소속을 적어 주세요'),sh('n-dept',dept?'':'부서를 골라 주세요'),sh('n-owner',owner?'':'성명을 적어 주세요'),sh('n-pos',pos?'':'직책/직급을 적어 주세요'),sh('n-tel',/^01\d-?\d{3,4}-?\d{4}$/.test(tel)?'':'전화번호를 010-0000-0000 모양으로 적어 주세요')];
  if(ok.includes(false)){const f=$$('#f-new input,#f-new select').find(i=>i.getAttribute('aria-invalid')==='true');f&&f.focus();return}
  P.unshift({id:nextId++,name:name.startsWith('(가상)')?name:'(가상) '+name,org,dept,owner,pos,tel,mail:$('#n-mail').value.trim(),date:'―',s:'준비',sub:0,N:5,doc:'none',ev:'none'});
  closeLayer($('#pn'));render();toast('사업을 만들었어요')});
render();
const m=location.hash.match(/#open=(\d+)/);if(m)setTimeout(()=>openP(+m[1]),50);
</script>
</body>
</html>
