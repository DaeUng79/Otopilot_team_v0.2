<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심사임당 입장</title>
<!-- 흐름: 기존 소개 첫 화면 → [평가 시작] → 아이콘 3개(총괄관리자 · 사업담당자 · 평가위원, 같은 비중) → 로그인. -->
<style>
:root{
  --primary-5:#ecf2fe;--primary-10:#d8e5fd;--primary-20:#b1cefb;--primary-50:#256ef4;--primary-60:#0b50d0;
  --secondary-70:#063a74;--secondary-90:#031f3f;--on-dark-2:#d8e5fd;--on-dark-3:#b1cefb;--glow:rgb(37 110 244/.2);--shadow-5:0 15px 35px rgb(3 31 63/.18);--vendor-a:#256ef4;--vendor-b:#267337;--vendor-c:#8a5c00;
  --gray-0:#fff;--gray-5:#f4f5f6;--gray-10:#e6e8ea;--gray-20:#cdd1d5;--gray-30:#b1b8be;--gray-50:#67717b;--gray-60:#58616a;--gray-70:#464c53;--gray-90:#1e2124;
  --text-1:var(--gray-90);--text-2:var(--gray-70);--text-3:var(--gray-60);
  --radius-sm:10px;--radius-lg:20px;
  --shadow-1:0 1px 3px rgb(3 31 63/.1);--shadow-4:0 10px 24px rgb(3 31 63/.16);
  --ease:cubic-bezier(.2,.9,.2,1);
  --page:var(--gray-0);
  font-family:'Pretendard GOV Variable','Pretendard GOV',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  font-size:17px;line-height:1.5;color:var(--text-1);-webkit-font-smoothing:antialiased;word-break:keep-all;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);min-height:100vh}
body.vb{--page:var(--gray-5)}
:focus-visible{outline:3px solid var(--primary-50);outline-offset:4px;border-radius:var(--radius-sm)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.vt{position:fixed;top:12px;right:16px;display:flex;gap:4px;font-size:16px;z-index:5}
.vt a{color:var(--text-3);text-decoration:none;padding:6px 14px;border-radius:var(--radius-sm);min-height:36px;display:inline-flex;align-items:center}
.vt a[aria-current="true"]{color:var(--primary-60);font-weight:700;background:var(--primary-5)}
.vt a:hover{background:var(--gray-10)}
.mark{position:fixed;top:16px;left:24px;font-weight:700;font-size:20px;letter-spacing:-.02em;color:var(--primary-60);margin:0}

main:focus{outline:none}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 24px 64px}
.choices{display:flex;gap:clamp(16px,4vw,72px);justify-content:center;align-items:flex-start;list-style:none;margin:0;padding:0}
.choices li{display:block}
@media (max-width:720px){.choices li{width:100%;display:flex;justify-content:center}}

.pick{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px;width:220px;
  transition:opacity .3s,width .35s var(--ease),padding .35s}
.ico{width:128px;height:128px;display:grid;place-items:center;transition:transform .25s var(--ease),box-shadow .25s}
.ico svg{width:128px;height:128px;display:block}
.name{font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--text-1)}
.hint{font-size:17px;color:var(--text-3);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s var(--ease);min-height:26px;margin-top:-8px}
.pick:hover .ico,.pick:focus-visible .ico{transform:translateY(-8px) scale(1.04)}
.pick:hover .hint,.pick:focus-visible .hint{opacity:1;transform:none}
.pick:active .ico{transform:scale(.96)}
.pick:focus-visible{outline-offset:2px}

.ic-fill{fill:var(--primary-5)} .ic-line{stroke:var(--primary-50)}
svg *{stroke-linecap:round;stroke-linejoin:round}

.vb .ico{width:148px;height:148px;border-radius:36px;background:var(--gray-0);box-shadow:var(--shadow-1)}
.vb .ico svg{width:96px;height:96px}
.vb .pick:hover .ico,.vb .pick:focus-visible .ico{box-shadow:var(--shadow-4)}
.vb .ic-fill{fill:var(--primary-10)}

.login{width:100%;max-width:400px;overflow:hidden;max-height:0;opacity:0;transform:translateY(24px);visibility:hidden;
  transition:max-height .45s var(--ease),opacity .35s,transform .45s var(--ease),margin .45s}
.picked .login{max-height:560px;opacity:1;transform:none;visibility:visible;margin-top:24px}
.picked .pick:not(.on){display:none}
.picked .choices{gap:0}
.picked .pick.on{cursor:default}
.picked .pick.on .ico{transform:none;width:88px;height:88px}
.picked .pick.on .ico svg{width:88px;height:88px}
.picked.vb .pick.on .ico{width:104px;height:104px;border-radius:28px}
.picked.vb .pick.on .ico svg{width:64px;height:64px}
.picked .pick.on .hint{display:none}
.picked .pick.on .name{font-size:24px}
.picked main{justify-content:flex-start;padding-top:11vh}
.back{appearance:none;background:none;border:0;color:var(--text-3);font-size:17px;min-height:44px;padding:0 12px;cursor:pointer;border-radius:var(--radius-sm);margin:0 auto 8px;display:flex;align-items:center}
.back:hover{background:var(--gray-10);color:var(--text-1)}
form{display:flex;flex-direction:column;gap:20px}
label{display:flex;flex-direction:column;gap:8px;font-size:18px;font-weight:700}
input{font-size:18px;font-weight:400;height:56px;border:1px solid var(--gray-50);border-radius:var(--radius-sm);padding:0 16px;background:var(--gray-0);width:100%}
input:focus{outline:3px solid var(--primary-20);border-color:var(--primary-50)}
.go{appearance:none;border:0;height:56px;border-radius:var(--radius-sm);background:var(--primary-50);color:#fff;font-size:18px;font-weight:700;cursor:pointer;margin-top:4px;transition:background .15s,transform .12s var(--ease)}
.go:hover{background:var(--primary-60)} .go:active{transform:scale(.98)}
.msg{min-height:28px;font-size:17px;text-align:center;color:var(--text-2);margin:0}
.msg.show::before{content:"ⓘ "}

@media (max-width:720px){
  main{padding:72px 16px 40px}
  .choices{flex-direction:column;gap:4px;align-items:center}
  .pick{display:grid;grid-template-columns:auto 1fr;column-gap:20px;row-gap:0;width:340px;max-width:100%;padding:8px 12px;text-align:left;align-items:center;justify-items:start}
  .pick .ico{grid-row:1/3}
  .ico,.ico svg{width:80px;height:80px}
  .vb .ico{width:88px;height:88px;border-radius:24px}.vb .ico svg{width:56px;height:56px}
  .hint{opacity:1;transform:none;margin:0;min-height:0;font-size:16px}
  .mark{left:16px}
  .picked .pick.on{display:flex}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .cs-tilt{transform:none!important}
}

/* ── 첫 화면(기존 앱 소개 화면 그대로) ── */
.intro{position:fixed;inset:0;z-index:20;overflow:auto;background:linear-gradient(160deg,var(--secondary-90),var(--secondary-70));color:#fff;
  padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;transition:opacity .45s var(--ease),visibility 0s}
.intro::before{content:'';position:absolute;inset:auto -20% -30% auto;width:70%;aspect-ratio:1;border-radius:var(--radius-full);background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.intro>*{position:relative}
.s-pick .intro{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s var(--ease),visibility 0s .45s}
.brand{display:flex;align-items:center;gap:12px}
.brand strong{font-size:20px;color:#fff;display:block}
.brand-mark{width:38px;height:38px;border-radius:var(--radius-sm);background:var(--primary-50);color:#fff;display:grid;place-items:center;font-weight:700}
.hero-body{display:flex;flex-direction:column}
.hero-eyebrow{color:var(--on-dark-3);font-weight:700;margin:0 0 8px}
.intro h1{font-size:48px;line-height:1.3;margin:12px 0 8px}
.cs-scene{perspective:1100px;height:40px;margin:0;display:grid;place-items:center;transform:translate(27vw,-70px) scale(1.4)}
.cs-tilt{position:relative;width:280px;height:250px;transform-style:preserve-3d;transition:transform .25s var(--ease)}
.cs-card{position:absolute;left:50%;top:50%;width:236px;margin:-108px 0 0 -118px;padding:16px;border-radius:var(--radius-lg);background:#fff;color:var(--text-1);box-shadow:var(--shadow-4);
  display:flex;flex-direction:column;gap:16px;transform:translate(var(--x),var(--y)) rotate(var(--r));animation:cs-in .9s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i)*110ms + 120ms)}
.cs-head{display:flex;align-items:center;gap:12px;font-size:16px}
.vendor-dot{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:var(--radius-sm);color:#fff;font-size:14px;font-weight:700;background:var(--vc)}
.cs-lines{display:flex;flex-direction:column;gap:8px}
.cs-lines i{display:block;height:9px;border-radius:var(--radius-lg);background:var(--gray-10)}
.cs-lines i.hl{background:#d3ebfd;box-shadow:inset 3px 0 0 var(--primary-50)}
.cs-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.cs-tag{font-size:14px;font-weight:700;color:var(--primary-60)}
.cs-page{font-size:14px;font-weight:700;padding:4px 12px;border-radius:var(--radius-lg);background:var(--primary-5);color:var(--primary-60);border:1px solid var(--primary-10)}
@keyframes cs-in{from{opacity:0;transform:translate(0,90px) rotate(0) scale(.86)}to{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}}
.hero-stats{list-style:none;padding:0;margin:12px 0 0;display:flex;gap:32px}
.hero-stats li{display:flex;flex-direction:column;gap:4px}
.hero-stats strong{font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-stats span{color:var(--on-dark-2);font-size:16px}
.hero-note{color:var(--on-dark-2);font-size:18px;margin:16px 0 0;max-width:600px;text-wrap:balance}
@media (max-height:760px){.hero-note{display:none}}
.hero-start{margin-top:32px;min-height:60px;padding:0 32px;border:0;border-radius:var(--radius-lg);background:#fff;color:var(--secondary-90);font:inherit;font-size:20px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-4);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.hero-start:hover{transform:translateY(-2px);box-shadow:var(--shadow-5)}
.hero-start:active{transform:scale(.98)}
.hero-start:focus-visible{outline:3px solid #fff;outline-offset:4px;box-shadow:none}
.intro small{color:var(--on-dark-3);font-size:16px}
.fade-up{animation:hero-fade-up .7s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes hero-fade-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.s-intro .vt{z-index:30}
.s-intro .vt a{color:var(--on-dark-3)} .s-intro .vt a[aria-current="true"]{background:rgb(255 255 255/.15);color:#fff} .s-intro .vt a:hover{background:rgb(255 255 255/.2)}
.s-intro .mark,.s-intro .home{visibility:hidden}
.home{position:fixed;top:56px;left:12px;appearance:none;background:none;border:0;color:var(--text-3);font-size:17px;min-height:44px;padding:0 12px;cursor:pointer;border-radius:var(--radius-sm);display:flex;align-items:center;z-index:5}
.home:hover{background:var(--gray-10);color:var(--text-1)}
.picked .home{visibility:hidden}
@media (max-width:1100px){.cs-scene{height:250px;transform:scale(.9)}}
@media (max-width:900px){.intro{padding:32px 24px}.intro h1{font-size:36px}.cs-scene{height:220px;transform:scale(.75);margin:-10px 0}.hero-start{width:100%}}
.ev-link-note{margin:12px 0 0;font-size:16px;color:var(--text-3);line-height:1.5}
.hero-stats{display:none}
.intro>small{visibility:hidden}
main>h1.sr-only{position:static;width:auto;height:auto;overflow:visible;clip:auto;white-space:normal;margin:0 0 32px;font-size:26px;font-weight:700;letter-spacing:-.01em;text-align:center}
.picked main>h1.sr-only{display:none}
@media (max-width:720px){main>h1.sr-only{margin-bottom:16px;font-size:22px}}
@media (hover:none){.hint{opacity:1;transform:none}}
</style>
</head>
<body class="s-intro">
<section class="intro" id="intro" aria-label="심사임당 소개">
  <div class="brand fade-up" style="--d:0ms"><span class="brand-mark">심</span><strong>심사임당</strong></div>
  <div class="hero-body">
    <p class="hero-eyebrow fade-up" style="--d:100ms">공공 제안평가 지원 서비스</p>
    <h1 class="fade-up" style="--d:200ms">근거를 빠르게 찾고,<br>판단은 위원이 합니다.</h1>
    <div class="cs-scene" aria-hidden="true"><div class="cs-tilt" id="tilt">
      <div class="cs-card" style="--x:-64px;--y:18px;--r:-9deg;--i:0;z-index:1"><div class="cs-head"><span class="vendor-dot" style="--vc:var(--vendor-a)">A</span><strong>A사 제안서</strong></div><div class="cs-lines"><i class="hl" style="width:78%"></i><i style="width:86%"></i><i class="hl" style="width:58%"></i><i style="width:92%"></i></div><div class="cs-foot"><span class="cs-tag">근거</span><span class="cs-page">p.12</span></div></div>
      <div class="cs-card" style="--x:0px;--y:-6px;--r:-1deg;--i:1;z-index:2"><div class="cs-head"><span class="vendor-dot" style="--vc:var(--vendor-b)">B</span><strong>B사 제안서</strong></div><div class="cs-lines"><i style="width:86%"></i><i style="width:58%"></i><i class="hl" style="width:92%"></i><i style="width:78%"></i></div><div class="cs-foot"><span class="cs-tag">근거</span><span class="cs-page">p.27</span></div></div>
      <div class="cs-card" style="--x:64px;--y:22px;--r:8deg;--i:2;z-index:3"><div class="cs-head"><span class="vendor-dot" style="--vc:var(--vendor-c)">C</span><strong>C사 제안서</strong></div><div class="cs-lines"><i class="hl" style="width:58%"></i><i style="width:92%"></i><i style="width:78%"></i><i class="hl" style="width:86%"></i></div><div class="cs-foot"><span class="cs-tag">근거</span><span class="cs-page">p.8</span></div></div>
    </div></div>
    <ul class="hero-stats fade-up" style="--d:450ms"><li><strong></strong><span></span></li><li><strong></strong><span></span></li><li><strong></strong><span></span></li></ul>
    <p class="hero-note fade-up" style="--d:330ms">AI가 찾은 근거에는 원문 쪽 번호가 붙어요. 점수는 사람만 입력해요.</p>
    <div class="fade-up" style="--d:600ms"><button type="button" class="hero-start" id="start">시작하기 →</button></div>
  </div>
  <small>© 2026 심사임당</small>
</section>

<p class="mark">심사임당</p>
<button class="home" type="button" id="home">‹ 처음으로</button>

<main id="stage" tabindex="-1" inert>
  <h1 class="sr-only">역할을 선택해 주세요</h1>
  <ul class="choices" role="list">
    <li><button class="pick" data-role="admin" type="button">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 96 96" fill="none" stroke-width="4">
        <rect class="ic-fill ic-line" x="10" y="14" width="76" height="50" rx="8"/>
        <path class="ic-line" d="M48 64v14M32 80h32"/>
        <circle class="ic-line" cx="48" cy="39" r="8" style="fill:#fff"/>
        <path class="ic-line" d="M48 24v5M48 49v5M33 39h5M58 39h5M37.5 28.5l3.5 3.5M55 46l3.5 3.5M58.5 28.5L55 32M41 46l-3.5 3.5"/></svg></span>
      <span class="name">총괄관리자</span><span class="hint">부서·계정·사업 관리</span></button></li>
    <li><button class="pick" data-role="biz" type="button">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 96 96" fill="none" stroke-width="4">
        <rect class="ic-fill ic-line" x="24" y="14" width="38" height="32" rx="4"/>
        <rect class="ic-line" x="34" y="6" width="38" height="34" rx="4" style="fill:#fff"/>
        <path class="ic-line" d="M44 23l7 7 12-14"/>
        <path class="ic-fill ic-line" d="M10 58l10-18h56l10 18v16a8 8 0 01-8 8H18a8 8 0 01-8-8z"/>
        <path class="ic-line" d="M10 58h24l4 8h20l4-8h24"/></svg></span>
      <span class="name">사업담당자</span><span class="hint">사업·문서·위원 관리</span></button></li>
    <li><button class="pick" data-role="eval" type="button">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 96 96" fill="none" stroke-width="4">
        <rect class="ic-fill ic-line" x="14" y="10" width="52" height="72" rx="8"/>
        <rect class="ic-line" x="24" y="24" width="9" height="9" rx="2"/><path class="ic-line" d="M40 28h18"/>
        <rect class="ic-line" x="24" y="42" width="9" height="9" rx="2"/><path class="ic-line" d="M40 46h18"/>
        <path class="ic-line" d="M25 66l4 4 7-8"/>
        <path class="ic-line" d="M52 76l-2 10 10-2 26-26-8-8z" style="fill:#fff"/>
        <path class="ic-line" d="M76 52l8 8"/></svg></span>
      <span class="name">평가위원</span><span class="hint">제안서 평가</span></button></li>
  </ul>

  <div class="login" id="login">
    <button class="back" type="button" id="back">‹ 다른 입장 선택</button>
    <form id="f" novalidate>
      <label><span class="lt">아이디</span><input autocomplete="off"></label>
      <label><span class="lt">비밀번호</span><input type="password" autocomplete="off"></label>
      <button class="go" type="submit">로그인</button>
      <p class="msg" id="msg" role="status"></p>
      <p class="ev-link-note" id="evnote" hidden>평가위원은 받은 <b>사업 링크</b>로 들어와요.</p>
    </form>
  </div>
</main>

<script>
(function(){
  document.body.classList.add('vb');
  var demo={admin:['sa-admin','Temp1234!'],biz:['info01','demo1234'],eval:['김가상','0001']};
  var body=document.body,stage=document.getElementById('stage'),msg=document.getElementById('msg'),f=document.getElementById('f');
  var picks=document.querySelectorAll('.pick'),cur=null;
  function setForm(role){
    var t=role==='eval'?[['이름','text'],['휴대전화 뒤 4자리','tel']]:[['아이디','text'],['비밀번호','password']];
    var local=window.simsaLocalLoginAccounts;
    var credentials=local?{admin:[local.super,local.password],biz:[local.department,local.password],eval:['','']}:demo;
    f.querySelectorAll('label').forEach(function(l,i){
      l.querySelector('.lt').textContent=t[i][0];
      var inp=l.querySelector('input');inp.type=t[i][1];inp.value=credentials[role][i];
      if(t[i][1]==='tel'){inp.setAttribute('inputmode','numeric');inp.setAttribute('maxlength','4');inp.placeholder='0000'}
      else{inp.removeAttribute('inputmode');inp.placeholder=''}
    });
    msg.textContent='';msg.classList.remove('show');
    document.getElementById('evnote').hidden=(role!=='eval');
  }
  function choose(btn){
    cur=btn;setForm(btn.dataset.role);
    picks.forEach(function(p){p.classList.toggle('on',p===btn)});
    body.classList.add('picked');
    setTimeout(function(){f.querySelector('input').focus()},150);
  }
  function toPick(){body.classList.remove('s-intro');body.classList.add('s-pick');document.getElementById('intro').inert=true;stage.inert=false;setTimeout(function(){stage.focus()},300)}
  function toIntro(){body.classList.remove('s-pick','picked');body.classList.add('s-intro');picks.forEach(function(p){p.classList.remove('on')});stage.inert=true;document.getElementById('intro').inert=false;document.getElementById('start').focus()}
  document.getElementById('start').addEventListener('click',toPick);
  document.getElementById('home').addEventListener('click',toIntro);
  document.getElementById('start').focus();
  var tilt=document.getElementById('tilt'),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!rm)document.getElementById('intro').addEventListener('pointermove',function(e){tilt.style.transform='rotateX('+(-(e.clientY/innerHeight-.5)*12).toFixed(2)+'deg) rotateY('+((e.clientX/innerWidth-.5)*12).toFixed(2)+'deg)'});
  function back(){
    body.classList.remove('picked');
    picks.forEach(function(p){p.classList.remove('on')});
    if(cur)cur.focus();
  }
  var loginPage={admin:'../../super-admin/SA-00/design/login.html',biz:'../../dept-admin/PM-00/design/login.html',eval:'../../evaluator/EV-00/design/login.html'};
  picks.forEach(function(p){p.addEventListener('click',function(){location.href=loginPage[p.dataset.role]})});
  document.getElementById('back').addEventListener('click',back);
  document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(body.classList.contains('picked'))back();else if(body.classList.contains('s-pick'))toIntro()});
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var r=cur&&cur.dataset.role;
