<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참석·위원장 · 심사임당 사업담당자</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../super-admin/_shell.css">
<link rel="stylesheet" href="../../_steps.css">
<style>
.seg{display:inline-flex;border:1px solid var(--gray-30);border-radius:var(--radius-sm);overflow:hidden;background:var(--gray-0)}
.seg button{appearance:none;border:0;background:none;min-height:44px;padding:0 18px;font-weight:700;color:var(--text-2);cursor:pointer;border-right:1px solid var(--gray-20);font-size:var(--t-base)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--gray-5)}
.seg button[aria-pressed="true"]{background:var(--primary-5);color:var(--primary-60);box-shadow:inset 0 -3px 0 var(--primary-50)}
.seg button[aria-pressed="true"]::before{content:"✓ "}
.xl-top{display:flex;gap:8px;flex-wrap:wrap}
.xl-sum{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 8px;font-size:var(--t-base)}
.xl-tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:auto;max-height:290px}
.xl-tbl td{height:48px;padding:0 12px}
.xl-sum{margin:12px 0 8px!important}
.xl-tbl tr.r-err td:first-child{box-shadow:inset 4px 0 0 var(--danger-50)}
.xl-tbl tr.r-dup td:first-child{box-shadow:inset 4px 0 0 var(--warning-50)}
.xl-act{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.cb{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--primary-50);cursor:pointer}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.foot{display:flex;align-items:center;gap:12px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex:none}
.foot .why{margin-right:auto;color:var(--text-2);font-size:var(--t-base)}
td input.cell,td select.cell{min-height:40px;font-size:var(--t-base)}
.demo .grp{display:inline-flex;gap:6px;align-items:center;margin-right:12px}
.proj{color:var(--text-3)}
.drawer.wide{width:min(760px,100vw)}
@media print{.side,.demo,.head .acts,.steps{display:none!important}.app{display:block}.main,.body,.card{height:auto;overflow:visible;box-shadow:none}body{overflow:visible}}

.cbar{display:flex;align-items:center;gap:20px;padding:16px 20px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.cbar .chk{flex-direction:row;gap:24px;flex:1;flex-wrap:wrap}
.cbar .chk li{align-items:center}
.chk{list-style:none;margin:0;padding:0;display:flex}
.chk li{display:flex;gap:10px;font-size:var(--t-base)}
.chk .ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.chk .okc .ic{background:var(--success-5);color:var(--success-60)}
.chk .badc .ic{background:var(--danger-5);color:var(--danger-60)}
.chk b{font-weight:700;margin-right:8px}
.chk small{display:block;color:var(--text-3);font-size:var(--t-base)}
.chk .badc small{color:var(--danger-60);font-weight:700}
.cbar .go{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lockbar{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--radius-sm);background:var(--warning-5);border:1px solid var(--warning-10);font-weight:700;font-size:var(--t-body);flex:1}
.att{display:grid;grid-template-columns:260px 1fr;overflow:hidden}
.side2{border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--gray-5)}
.vs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vs li{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:var(--radius-sm);color:var(--text-3);font-weight:700;font-size:var(--t-base)}
.vs .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gray-10);color:var(--text-2);font-size:14px}
.vs .dn{color:var(--text-1)}.vs .dn .n{background:var(--success-5);color:var(--success-60)}
.vs .cr{background:var(--primary-5);color:var(--primary-60);box-shadow:inset 0 -3px 0 var(--primary-50)}.vs .cr .n{background:var(--primary-50);color:#fff}
.ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.ctr .ico{width:64px;height:64px;border-radius:50%;background:var(--primary-5);display:grid;place-items:center;font-size:var(--t-2xl)}
.chk.inl{flex-direction:row;gap:20px;flex-wrap:wrap;margin-right:auto;align-items:center}
.chk{flex-direction:column;gap:10px}
.chk li{align-items:flex-start}
.chk.inl li{align-items:center}
.foot{gap:16px}
.rd{width:24px;height:24px;min-height:0;accent-color:var(--primary-50);cursor:pointer}
.rd:disabled{cursor:not-allowed}
tr.chair td{background:var(--primary-5)}


/* ── 태블릿 보강 (CSS만): 1181px 이상 데스크톱에는 적용되지 않음 ── */
@media (max-width: 1180px) {
  .cb, .rd { width: 32px; height: 32px; }
}
@media (max-width: 1024px) {
  .att { grid-template-columns: 200px minmax(0, 1fr); }
  .cbar { padding: 12px 16px; gap: 12px; }
}
tbody td .muted{display:none}
ul.chk.inl li:first-child:nth-last-child(4){display:none}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <button class="brand" type="button" data-href="../../PM-01/design/projects.html" aria-label="심사임당 사업 목록으로"><span class="brand-mark">심</span><span>심사임당</span></button>
  <p class="role">사업담당자</p>
  <nav aria-label="주 메뉴">
    <a href="../../PM-01/design/projects.html" aria-current="page">사업 목록</a>
    <a href="../../PM-07/design/pool.html">위원 풀</a>
  </nav>
  <div class="bottom">
    <a href="../../PM-00/design/login.html#account" data-account>내 계정</a>
    <a href="../../PM-00/design/login.html" data-logout>로그아웃</a>
  </div>
</aside>
<div class="main">
  <div class="pj-head">
    <a class="pj-back" href="../../PM-01/design/projects.html">← 사업 목록</a>
    <div class="pj-row">
      <div class="pj-title"><h1>사업</h1><span class="badge" id="pst">○ 준비</span></div>
      <div class="pj-act"><span class="hint">평가일</span></div>
    </div>
  </div>
  <nav class="steps" id="steps" aria-label="사업 진행 단계"></nav>
  <div class="body">
    <section class="card att" aria-label="참석 현황과 위원장">
      <aside class="side2" id="side2"></aside>
      <div class="pane" id="main"></div>
    </section>
  </div>
  <details class="demo"><summary>시안 상태</summary><div class="demo-in"><span class="grp" id="presets"></span>
    <span class="muted">(가상 데이터)</span></div></details>

</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="scrim top" id="scrim2"></div>
<aside class="drawer" id="p" role="dialog" aria-modal="true" aria-labelledby="p-t">
  <header><h2 id="p-t"></h2><button class="x" type="button" data-close aria-label="닫기">×</button></header>
  <div class="dbody" id="p-body"></div>
  <footer id="p-foot"></footer>
</aside>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-b">
  <h2 id="dlg-t"></h2><p id="dlg-b"></p>
  <div class="acts"><button class="btn" type="button" id="dlg-cancel" data-close>취소</button><button class="btn primary" type="button" id="dlg-ok"></button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../../_ui.js"></script>
<script>
/* 가상 데이터. 참석 확인(ATT-01)은 위원이 직접 해요. 여기서는 볼 수만 있어요. */
const CAP=7,MIN=5;
const FIELDS=['시스템 구축','정보보안','데이터·AI','사업관리'];
const NAMES=[['한도윤','본',0],['정민재','본',0],['이서연','본',1],['강예린','본',1],['박지호','본',2],['양지안','본',2],['최유나','본',3],['신주원','예비 1',1],['조은서','예비 2',3]];
const ATT={ok:[1,1,1,0,1,1,1,1,0],few:[1,0,1,0,0,1,0,0,0]};
let S={recv:true,prepared:false,refreshed:false,locked:false,chair:null,started:false,scn:'ok',sel:null,pick:null};
const M=()=>NAMES.map((n,i)=>({id:i,name:n[0],kind:n[1],field:FIELDS[n[2]],at:!!ATT[S.scn][i]}));
const okIds=()=>M().filter(m=>m.at).map(m=>m.id);
function selSet(){if(!S.sel)S.sel=new Set(okIds().slice(0,CAP));return S.sel}
function lockChecks(){const sel=[...selSet()],L=M().filter(m=>sel.includes(m.id));
  const miss=FIELDS.filter(f=>!L.some(m=>m.field===f));
  return [{ok:L.length>=MIN,t:`최소 인원 ${MIN}명 이상`,s:`선택 ${L.length}명`},{ok:L.length<=CAP,t:`정원 ${CAP}명 이하`,s:`선택 ${L.length}명`},{ok:!miss.length,t:'분야마다 1명 이상',s:miss.length?miss.join('·')+' 분야에 참석자가 없어요':'4개 분야 모두 있어요'}]}
const STEPS=['평가회차 준비','참석 현황 확인','실제 평가인원 확정','위원장 지정','평가 시작'];
function cur(){if(S.started)return 5;if(!S.prepared)return 0;if(!S.locked)return S.refreshed?2:1;if(S.chair==null)return 3;return 4}
function ckList(){const c=cur();return `<ol class="vs" aria-label="평가 시작까지 순서">${STEPS.map((t,i)=>`<li class="${i<c?'dn':i===c?'cr':''}" ${i===c?'aria-current="step"':''}><span class="n" aria-hidden="true">${i<c?'✓':i+1}</span><span>${t}</span></li>`).join('')}</ol>`}
function render(){
  const c=cur(),L=M();
  renderSteps($('#steps'),['done','done','done','done','current','locked']);
  $('#pst').className='badge '+(S.started?'primary':'');$('#pst').textContent=S.started?'● 평가 중':'○ 준비';
  $('#side2').innerHTML=`<strong>평가 시작까지</strong>${ckList()}<p class="muted" style="font-size:var(--t-base)">${S.started?'시작했어요. 참여자·업체·기준이 잠겼어요.':'지금 할 일: <b style="color:var(--text-1)">'+STEPS[Math.min(c,4)]+'</b>'}</p>`;
  const m=$('#main');
  if(c===0){
    m.innerHTML=`<div class="ctr"><div class="ico" aria-hidden="true">📋</div><strong style="font-size:var(--t-2xl)">평가회차를 준비해요</strong>
    <ul class="chk" style="text-align:left">
      <li class="okc"><span class="ic">✓</span><span><b>확정 명단 수신</b>본위원 7명 · 예비 2명</span></li>
      <li class="${S.recv?'okc':'badc'}"><span class="ic">${S.recv?'✓':'!'}</span><span><b>승인 평가표 수신</b>${S.recv?'평가항목 5개 · 합계 100점':'아직 평가 쪽에서 받지 못했어요'}</span></li>
      <li class="okc"><span class="ic">✓</span><span><b>정원 · 집계 정책</b>정원 ${CAP}명 · 최고·최저 제외 평균</span></li></ul>
    <button class="btn primary lg" type="button" id="b-prep" ${S.recv?'':'disabled'}>평가회차 준비</button>${S.recv?'':'<span class="err">평가표 수신 뒤에 준비할 수 있어요</span>'}</div>`;
    $('#b-prep').onclick=()=>{S.prepared=true;render();toast('평가회차를 준비했어요 (준비 중 상태)')};return}
  selSet();const showSel=c<=2&&!S.locked;
  const part=S.locked?L.filter(x=>S.sel.has(x.id)):L;
  const confirmedN=L.filter(x=>x.at).length;
  let tb=`<div class="toolbar"><strong>${S.locked?'확정 참여자 '+part.length+'명':'위원 '+L.length+'명'}</strong><span class="badge success">✓ 참석 확인 ${confirmedN}</span><span class="badge">… 미확인 ${L.length-confirmedN}</span>${S.locked?'':'<button class="btn sm" type="button" id="b-ref">참석자 새로고침</button>'}<span class="count">${S.locked?'':'참석 확인은 위원이 직접 해요. 확인한 위원만 위원장 후보가 돼요.'}</span></div>`;
  const th=`<tr>${showSel?'<th style="width:64px">선택</th>':''}${S.locked&&!S.started?'<th style="width:72px">위원장</th>':''}${S.started?'<th style="width:90px">위원장</th>':''}<th>이름</th><th>구분</th><th>분야</th><th>참석 확인</th></tr>`;
  const rows=part.map(x=>{const isCh=S.chair===x.id;
    return `<tr class="${isCh?'chair':''}">${showSel?`<td><input class="rd" type="checkbox" data-sel="${x.id}" aria-label="${x.name} 평가인원에 넣기" ${x.at?'':'disabled'} ${S.sel.has(x.id)&&x.at?'checked':''}></td>`:''}${S.locked?`<td>${S.chair==null?`<input class="rd" type="radio" name="chair" value="${x.id}" aria-label="${x.name} 위원장으로 고르기" ${S.pick===x.id?'checked':''}>`:isCh?'<span class="badge primary">★ 위원장</span>':''}</td>`:''}
    <td class="strong">${x.name}</td><td><span class="badge ${x.kind==='본'?'info':''}">${x.kind==='본'?'본위원':'예비 '+x.kind.slice(3)}</span></td><td>${x.field}</td>
    <td>${x.at?'<span class="badge success">✓ 참석 확인</span>':'<span class="badge">… 미확인</span> <span class="muted">위원장 후보 아님</span>'}</td></tr>`}).join('');
  let foot='';
  if(S.started)foot=`<span class="why">평가를 시작했어요. 위원장이 결과를 확인·제출하면 결과가 열려요.</span><a class="btn" href="../../PM-06/design/results.html">결과 화면 보기</a>`;
  else if(c<=2){const C=lockChecks(),ok=C.every(z=>z.ok);
    foot=`<ul class="chk inl">${C.map(z=>`<li class="${z.ok?'okc':'badc'}"><span class="ic">${z.ok?'✓':'!'}</span><span><b>${z.t}</b><small>${z.s}</small></span></li>`).join('')}</ul><button class="btn primary" type="button" id="b-lock" ${ok?'':'disabled'}>실제 평가인원 확정</button>`}
  else if(c===3)foot=`<span class="why">잠긴 참여자 중 한 명을 위원장으로 지정해 주세요.</span><button class="btn primary" type="button" id="b-chair" ${S.pick==null?'disabled':''}>위원장 지정</button>`;
  else{const chk=[['데이터 수신','확정 명단 · 승인 평가표 · 업체 문서 3/3 수신 완료'],['참석','확정 참여자 '+part.length+'명 모두 참석 확인'],['위원장','★ '+L[S.chair].name],['집계 정책','최고·최저 제외 평균']];
    foot=`<ul class="chk inl">${chk.map(z=>`<li class="okc"><span class="ic">✓</span><span><b>${z[0]}</b><small>${z[1]}</small></span></li>`).join('')}</ul><button class="btn primary" type="button" id="b-start">평가 시작</button>`}
  m.innerHTML=tb+`<div class="tbl-wrap"><table><thead>${th}</thead><tbody>${rows}</tbody></table></div><div class="foot">${foot}</div>`;
  $('#b-ref')&&($('#b-ref').onclick=()=>{S.refreshed=true;render();toast('참석 현황을 새로 불러왔어요')});
  $$('[data-sel]').forEach(cb=>cb.onchange=()=>{cb.checked?S.sel.add(+cb.dataset.sel):S.sel.delete(+cb.dataset.sel);render()});
  $('#b-lock')&&($('#b-lock').onclick=()=>confirmDlg({title:'실제 평가인원 '+S.sel.size+'명을 확정할까요?',body:'확정하면 참여자가 잠겨요. 이 명단 안에서만 위원장을 정할 수 있어요.',ok:'확정하기',onOk:()=>{S.locked=true;render();toast('실제 평가인원을 잠갔어요')}}));
  $$('input[name=chair]').forEach(r=>r.onchange=()=>{S.pick=+r.value;render();document.querySelector(`input[name=chair][value="${S.pick}"]`).focus()});
  $('#b-chair')&&($('#b-chair').onclick=()=>{const nm=L[S.pick].name;confirmDlg({title:nm+' 위원을 위원장으로 지정할까요?',body:'위원장은 모든 위원이 점수를 낸 뒤 결과를 확인하고 최종 제출해요.',ok:'지정하기',onOk:()=>{S.chair=S.pick;render();toast(nm+' 위원을 위원장으로 지정했어요')}})});
  $('#b-start')&&($('#b-start').onclick=()=>confirmDlg({title:'평가를 시작할까요?',body:'시작하면 바꿀 수 없어요. 참여자·위원장·업체·평가표·집계 정책이 한꺼번에 잠겨요.',ok:'시작하기',onOk:()=>{S.started=true;render();toast('평가를 시작했어요')}}));
}
const base=()=>({recv:true,prepared:false,refreshed:false,locked:false,chair:null,started:false,scn:'ok',sel:null,pick:null});
const PRE={wait:['① 평가표 수신 전',()=>({recv:false})],prep:['① 준비 가능',()=>({})],att:['② 참석 현황',()=>({prepared:true,refreshed:true})],few:['③ 인원 모자람',()=>({prepared:true,refreshed:true,scn:'few'})],lock:['④ 위원장 고르기',()=>({prepared:true,refreshed:true,locked:true,sel:new Set([0,1,2,4,5,6,7])})],go:['⑤ 시작 전',()=>({prepared:true,refreshed:true,locked:true,sel:new Set([0,1,2,4,5,6,7]),chair:0,pick:0})],run:['시작 후',()=>({prepared:true,refreshed:true,locked:true,sel:new Set([0,1,2,4,5,6,7]),chair:0,pick:0,started:true})]};
$('#presets').innerHTML=Object.entries(PRE).map(([k,v],i)=>`<button type="button" data-pre="${k}" aria-pressed="${i===1}">${v[0]}</button>`).join('');
$$('[data-pre]').forEach(b=>b.onclick=()=>{S=Object.assign(base(),PRE[b.dataset.pre][1]());$$('[data-pre]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$$('[data-pre]').find(b=>b.dataset.pre===(location.hash.slice(1)||'prep')).click();
</script>
</body>
</html>
