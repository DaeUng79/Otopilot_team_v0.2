<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위원 풀 · 직접 등록 · 심사임당 사업담당자</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../super-admin/_shell.css">
<link rel="stylesheet" href="../../_steps.css">
<style>
.seg{display:inline-flex;border:1px solid var(--gray-30);border-radius:var(--radius-sm);overflow:hidden;background:var(--gray-0)}
.seg button{appearance:none;border:0;background:none;min-height:44px;padding:0 18px;font-weight:700;color:var(--text-2);cursor:pointer;border-right:1px solid var(--gray-20);font-size:var(--t-base)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--gray-5)}
.seg button[aria-pressed="true"]{background:var(--primary-5);color:var(--primary-60);box-shadow:inset 0 -3px 0 var(--primary-50)}
.seg button[aria-pressed="true"]::before{content:"✓ "}
.xl-top{display:flex;gap:8px;flex-wrap:wrap}
.xl-sum{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 8px;font-size:var(--t-base)}
.xl-tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:auto;max-height:290px}
.xl-tbl td{height:48px;padding:0 12px}
.xl-sum{margin:12px 0 8px!important}
.xl-tbl tr.r-err td:first-child{box-shadow:inset 4px 0 0 var(--danger-50)}
.xl-tbl tr.r-dup td:first-child{box-shadow:inset 4px 0 0 var(--warning-50)}
.xl-act{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.cb{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--primary-50);cursor:pointer}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.foot{display:flex;align-items:center;gap:12px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex:none}
.foot .why{margin-right:auto;color:var(--text-2);font-size:var(--t-base)}
td input.cell,td select.cell{min-height:40px;font-size:var(--t-base)}
.demo .grp{display:inline-flex;gap:6px;align-items:center;margin-right:12px}
.proj{color:var(--text-3)}
.drawer.wide{width:min(760px,100vw)}
@media print{.side,.demo,.head .acts,.steps{display:none!important}.app{display:block}.main,.body,.card{height:auto;overflow:visible;box-shadow:none}body{overflow:visible}}

td.em{max-width:230px}
.seg button{min-height:40px;padding:0 14px}
.fgrid2{display:flex;flex-direction:column;gap:16px}
td,th{padding-left:12px;padding-right:12px}

</style>
</head>
<body>
<div class="app">
<aside class="side">
  <button class="brand" type="button" data-href="../../PM-01/design/projects.html" aria-label="심사임당 사업 목록으로"><span class="brand-mark">심</span><span>심사임당</span></button>
  <p class="role">(가상) 정보화담당관</p>
  <nav aria-label="주 메뉴">
    <a href="../../PM-01/design/projects.html">사업 목록</a>
    <a href="../../PM-07/design/pool.html" aria-current="page">위원 풀</a>
  </nav>
  <div class="bottom">
    <a href="../../PM-00/design/login.html#account" data-account>내 계정</a>
    <a href="../../PM-00/design/login.html" data-logout>로그아웃</a>
  </div>
</aside>
<div class="main">
  <header class="head">
    <div><h1>위원 풀</h1><p class="sub" id="sub"></p></div>
    <div class="acts" style="display:flex;gap:8px"><button class="btn" type="button" id="b-tpl">엑셀 양식 다운로드</button><button class="btn" type="button" id="b-xl">엑셀 선택 / 미리보기</button><button class="btn primary" type="button" id="b-add">개별 등록</button></div>
  </header>
  <div class="body">
    <section class="card" aria-label="위원 풀">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="범위" id="f-scope"><button type="button" data-s="dept" aria-pressed="true">부서 풀</button><button type="button" data-s="proj" aria-pressed="false">이 사업 직접 등록</button></div>
        <div class="chips" role="group" aria-label="분야로 거르기" id="f-field"></div>
        <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input type="search" id="q" placeholder="이름·소속 검색" aria-label="이름이나 소속 검색"></div>
        <span class="count" id="count"></span>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>이름</th><th>소속</th><th>부서</th><th>직책</th><th>분야</th><th>휴대전화</th><th>이메일</th><th class="num">참여</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="note" id="pnote" hidden style="margin:12px 16px"><span>i</span><span>이 사업에만 쓰는 후보예요. 부서 풀에는 자동으로 들어가지 않아요.</span></div>
        <div class="state" id="none" hidden><div class="ico" aria-hidden="true">?</div><strong>맞는 위원이 없어요</strong><p>분야를 바꾸거나 검색어를 지워 보세요.</p></div>
      </div>
    </section>
  </div>
  <details class="demo"><summary>시안 상태</summary><div class="demo-in"><span class="muted">(가상 데이터) 전화번호는 가려서 보여요 · 행을 누르면 수정·삭제 · 직접 등록 후보는 풀에 자동으로 들어오지 않아요</span></div></details>

</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="scrim top" id="scrim2"></div>
<aside class="drawer wide" id="p" role="dialog" aria-modal="true" aria-labelledby="p-t">
  <header><h2 id="p-t"></h2><button class="x" type="button" data-close aria-label="닫기">×</button></header>
  <div class="dbody" id="p-body"></div>
  <footer id="p-foot"></footer>
</aside>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-b">
  <h2 id="dlg-t"></h2><p id="dlg-b"></p>
  <div class="acts"><button class="btn" type="button" id="dlg-cancel" data-close>취소</button><button class="btn primary" type="button" id="dlg-ok"></button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../../_ui.js"></script>
<script>
/* 가상 데이터 (휴대전화는 화면에 가려서 표시) */
const FIELDS=['시스템 구축','정보보안','데이터·AI','사업관리'];
const mk=(a,sc)=>a.map((r,i)=>({id:sc+i,scope:sc,org:r[0],dept:r[1],name:r[2],pos:r[3],field:r[4],tel:r[5],email:r[6]||'',n:r[7]||0}));
const POOL=mk([
 ['(가상)한빛대학교','컴퓨터공학과','한도윤','교수','시스템 구축','010-0000-0001','doyun.han@example.com',3],
 ['(가상)한빛대학교','정보보호학과','이서연','부교수','정보보안','010-0000-0002','seoyeon.lee@example.com',2],
 ['(가상)누리연구원','AI연구실','박지호','책임연구원','데이터·AI','010-0000-0003','',4],
 ['(가상)새솔대학교','경영학과','최유나','교수','사업관리','010-0000-0004','yuna.choi@example.com',1],
 ['(가상)푸른대학교','소프트웨어학과','정민재','교수','시스템 구축','010-0000-0005','',5],
 ['(가상)다온연구원','보안연구실','강예린','선임연구원','정보보안','010-0000-0006','yerin.kang@example.com',2],
 ['(가상)한빛대학교','데이터사이언스과','윤태오','조교수','데이터·AI','010-0000-0007','',0],
 ['(가상)새솔대학교','산업공학과','장하은','교수','사업관리','010-0000-0008','haeun.jang@example.com',3],
 ['(가상)푸른대학교','컴퓨터공학과','임건우','교수','시스템 구축','010-0000-0009','',1],
 ['(가상)누리연구원','클라우드센터','오수아','책임연구원','시스템 구축','010-0000-0010','sua.oh@example.com',2],
 ['(가상)다온연구원','정보보호팀','신주원','수석연구원','정보보안','010-0000-0011','',6],
 ['(가상)한빛대학교','통계학과','배도하','교수','데이터·AI','010-0000-0012','doha.bae@example.com',1]],'dept')
 .concat(mk([
 ['(가상)미래대학교','행정학과','조은서','부교수','사업관리','010-0000-0013','',0],
 ['(가상)미래대학교','컴퓨터공학과','양지안','교수','시스템 구축','010-0000-0014','',0],
 ['(가상)하늘연구원','정보보호팀','서이준','책임연구원','정보보안','010-0000-0015','',0]],'proj'));
const XLS=[
 ['권도현','010-0000-0101','(가상)한빛대학교','컴퓨터공학과','교수','시스템 구축',''],
 ['서하린','010-0000-0102','(가상)누리연구원','AI연구실','책임연구원','데이터·AI','harin.seo@example.com'],
 ['한도윤','010 0000 0001','(가상)한빛대학교','컴퓨터공학과','교수','시스템 구축',''],
 ['문지후','010-0000-0104','(가상)새솔대학교','경영학과','교수','사업관리','jihu.moon.example.com'],
 ['배서윤','','(가상)푸른대학교','소프트웨어학과','부교수','정보보안',''],
 ['류시우','010-0000-0106','(가상)다온연구원','보안연구실','선임연구원','정보보안','']];
const mask=t=>String(t).replace(/^(\d{3})\D*\d{4}\D*(\d{4})$/,'$1-****-$2');
const norm=t=>String(t).replace(/\D/g,'');
let P=POOL.map(p=>({...p}));let scope='dept',ff='',q='',nid=300;
const SCN={dept:'부서 풀',proj:'이 사업 직접 등록'};
/* COM-01 검색 */
$('#f-field').innerHTML=['전체',...FIELDS].map((f,i)=>`<button class="chip" type="button" data-f="${i?f:''}" aria-pressed="${i===0}">${f}</button>`).join('');
$$('#f-field .chip').forEach(c=>c.onclick=()=>{ff=c.dataset.f;$$('#f-field .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render()});
function setScope(s){scope=s;$$('#f-scope button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===s));render()}
$$('#f-scope button').forEach(b=>b.onclick=()=>setScope(b.dataset.s));
$('#q').oninput=e=>{q=e.target.value.trim();render()};
const list=()=>P.filter(r=>r.scope===scope&&(!ff||r.field===ff)&&(!q||r.name.includes(q)||r.org.includes(q)));
function render(){const L=list();$('#count').textContent=SCN[scope]+' '+L.length+'명';$('#none').hidden=L.length>0;$('table').hidden=!L.length;$('#pnote').hidden=scope!=='proj';
  $('#sub').textContent=scope==='dept'?'우리 부서의 평가위원 후보예요. 사업마다 여기서 추첨해요.':'이 사업에만 직접 넣은 후보예요. 부서 풀에는 자동으로 들어가지 않아요.';
  $('#rows').innerHTML=L.map(r=>`<tr tabindex="0" data-id="${r.id}" aria-label="${h(r.name)} 자세히 보기"><td class="strong">${h(r.name)}</td><td>${h(r.org.replace('(가상)',''))}</td><td>${h(r.dept)}</td><td>${h(r.pos)}</td><td>${h(r.field)}</td><td class="tnum">${mask(r.tel)}</td><td class="em">${r.email?h(r.email):'<span class="muted">—</span>'}</td><td class="num tnum">${r.n}회</td></tr>`).join('');
  $$('#rows tr').forEach(tr=>rowKey(tr,()=>openDetail(tr.dataset.id)))}
const footBtns=html=>{$('#p-foot').innerHTML=html};
/* COM-06 수정 · COM-07 삭제 */
function openDetail(id){const r=P.find(x=>String(x.id)===String(id));$('#p-t').textContent=r.name;
  $('#p-body').innerHTML=`<dl class="kv"><dt>범위</dt><dd>${SCN[r.scope]}</dd><dt>소속</dt><dd>${h(r.org)}</dd><dt>부서</dt><dd>${h(r.dept)}</dd><dt>직책</dt><dd>${h(r.pos)}</dd><dt>분야</dt><dd>${h(r.field)}</dd><dt>휴대전화</dt><dd class="tnum">${mask(r.tel)}</dd><dt>이메일</dt><dd>${r.email?h(r.email):'—'}</dd><dt>참여 횟수</dt><dd>${r.n}회</dd></dl>
  <div class="note"><span>i</span><span>고치거나 지워도 이미 확정된 명단과 추첨 증빙은 그대로 남아요.</span></div>`;
  footBtns('<button class="btn text-danger" type="button" id="b-del" style="margin-right:auto">삭제</button><button class="btn primary" type="button" id="b-edit">수정</button>');
  $('#b-edit').onclick=()=>form(r);
  $('#b-del').onclick=()=>confirmDlg({title:'‘'+r.name+'’ 위원을 삭제할까요?',body:'비활성으로 바뀌어 목록에서 사라져요. 확정 명단·추첨 증빙은 지우지 않아요.',ok:'삭제',danger:true,onOk:()=>{P=P.filter(x=>x!==r);closeLayer($('#p'));render();toast('비활성으로 바꿨어요')}});
  openLayer($('#p'),'.x')}
/* COM-05 개별 등록 */
function form(r){const e=!!r;$('#p-t').textContent=e?'위원 수정':'개별 등록';const v=r||{org:'',dept:'',name:'',pos:'',field:FIELDS[0],email:'',tel:'',scope};
  const f=(k,l,ph,t='text',val=v[k])=>`<label class="field">${l}<input id="f-${k}" type="${t}" placeholder="${ph}" value="${h(val)}"></label>`;
  $('#p-body').innerHTML=`<div class="fgrid2">${f('name','이름','홍길동')}${f('tel','휴대전화',e?mask(v.tel)+' (바꿀 때만 입력)':'010-0000-0000','tel','')}${f('org','소속','(가상)한빛대학교')}${f('dept','부서','컴퓨터공학과')}${f('pos','직책','교수')}
  <label class="field">분야<select id="f-field">${FIELDS.map(x=>`<option ${x===v.field?'selected':''}>${x}</option>`).join('')}</select></label>${f('email','이메일 (선택)','name@example.com','email')}
  <div class="field">등록 범위<div class="seg" id="f-sc" role="group"><button type="button" data-s="dept" aria-pressed="${v.scope==='dept'}" ${e?'disabled':''}>부서 풀</button><button type="button" data-s="proj" aria-pressed="${v.scope==='proj'}" ${e?'disabled':''}>이 사업 직접 등록</button></div></div></div><div id="ferr"></div>`;
  let sc=v.scope;$$('#f-sc button').forEach(b=>b.onclick=()=>{sc=b.dataset.s;$$('#f-sc button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  footBtns('<button class="btn" type="button" id="b-cancel">취소</button><button class="btn primary" type="button" id="b-save">'+(e?'저장':'등록')+'</button>');
  $('#b-cancel').onclick=()=>e?openDetail(r.id):closeLayer($('#p'));
  $('#b-save').onclick=()=>{const g=k=>$('#f-'+k).value.trim();let m='';const tel=g('tel')||(e?r.tel:'');
    if(!g('org')||!g('name'))m='이름과 소속을 적어 주세요';else if(norm(tel).length!==11||!/^010/.test(norm(tel)))m='휴대전화는 010으로 시작하는 11자리로 적어 주세요';
    else{const d=P.find(x=>x.scope==='dept'&&norm(x.tel)===norm(tel)&&x!==r);if(d&&!(e&&!g('tel')))m='같은 휴대전화가 이미 우리 부서 풀에 있어요 ('+d.name+'). 하이픈·공백은 빼고 비교해요.'}
    if(m){$('#ferr').innerHTML='<p class="err" role="alert">'+m+'</p>';return}
    const d={org:g('org'),dept:g('dept'),name:g('name'),pos:g('pos'),field:$('#f-field').value,email:g('email'),tel};
    if(e){Object.assign(r,d);toast('고쳤어요 · 새 버전으로 저장됐어요');render();openDetail(r.id)}else{P.unshift({id:'n'+nid++,n:0,scope:sc,...d});toast(SCN[sc]+'에 등록했어요'+(sc==='proj'?' · 부서 풀에는 들어가지 않아요':''));setScope(sc);closeLayer($('#p'))}};
  if(!stack.some(l=>l.el===$('#p')))openLayer($('#p'),'#f-name');else setTimeout(()=>$('#f-name').focus(),60)}
$('#b-add').onclick=()=>form(null);
/* COM-02 양식 */
function tpl(){const head=['이름','휴대전화','소속','부서','직책','분야','이메일(선택)'];const csv='﻿'+head.join(',')+'\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='위원_등록_양식.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('양식을 내려받았어요 ('+head.join('·')+')')}
$('#b-tpl').onclick=tpl;
/* COM-03 미리보기 · COM-04 검증 목록 등록 */
function check(r){
  if(!r[0]||!r[2])return {k:'err',m:'이름·소속이 비었어요'};
  if(!FIELDS.includes(r[5]))return {k:'err',m:'분야를 확인해 주세요'};
  if(norm(r[1]).length!==11)return {k:'err',m:'휴대전화가 없거나 자리 수가 달라요'};
  if(r[6]&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r[6]))return {k:'err',m:'이메일 형식이 아니에요'};
  if(P.some(x=>x.scope==='dept'&&norm(x.tel)===norm(r[1])))return {k:'dup',m:'같은 휴대전화가 부서 풀에 있어요'};
  return {k:'ok',m:''}}
let registered=false;
function openExcel(demo){registered=false;$('#p-t').textContent='엑셀 선택 / 미리보기';
  $('#p-body').innerHTML=`<div class="xl-top"><label class="btn" tabindex="0" id="pick">엑셀 선택<input type="file" class="sr-only" accept=".xlsx,.xls,.csv" tabindex="-1"></label><button class="btn" type="button" id="demo">예시 파일로 미리보기</button></div>
  <p class="muted" style="margin-top:8px">등록 범위: <b>${SCN[scope]}</b> · 미리보기만으로는 후보가 만들어지지 않아요.</p><div id="prev"></div>`;
  footBtns('<button class="btn" type="button" id="x-close">닫기</button>');$('#x-close').onclick=()=>closeLayer($('#p'));
  const inp=$('#pick input');inp.onchange=()=>{if(inp.files[0])show(inp.files[0].name)};
  $('#pick').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}});
  $('#demo').onclick=()=>show('예시_위원목록.xlsx');
  function show(name){const R=XLS.map(r=>({r,c:check(r)}));const ok=R.filter(x=>x.c.k==='ok'),er=R.filter(x=>x.c.k==='err').length,du=R.filter(x=>x.c.k==='dup').length;
    $('#prev').innerHTML=`<div class="xl-sum"><b>${h(name)}</b><span class="badge success">✓ 정상 ${ok.length}</span><span class="badge danger">! 오류 ${er}</span><span class="badge warning">= 중복 ${du}</span></div>
    <div class="xl-tbl"><table><thead><tr><th>줄</th><th>이름</th><th>휴대전화</th><th>분야</th><th>확인 결과</th></tr></thead><tbody>${R.map((x,i)=>`<tr class="r-${x.c.k}"><td class="tnum">${i+2}</td><td class="strong">${h(x.r[0]||'(빈칸)')}</td><td class="tnum">${x.r[1]?mask(x.r[1]):'(빈칸)'}</td><td>${h(x.r[5])}</td><td><span class="badge ${x.c.k==='ok'?'success':x.c.k==='dup'?'warning':'danger'}">${x.c.k==='ok'?'✓ 정상':x.c.k==='dup'?'= 중복':'! 오류'}</span> <span class="muted">${x.c.m}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="xl-act"><span class="muted">제외 ${er+du}줄 (오류 ${er} · 중복 ${du}) · 정상 ${ok.length}명만 등록돼요.<br>같은 요청은 한 번만 등록돼요.</span><button class="btn primary" type="button" id="xl-go" ${ok.length?'':'disabled'}>검증 목록 등록</button></div><div id="xl-res"></div>`;
    $('#xl-go').onclick=()=>{if(registered){toast('같은 요청은 이미 등록됐어요');return}registered=true;
      ok.forEach(x=>P.unshift({id:'n'+nid++,scope,org:x.r[2],dept:x.r[3],name:x.r[0],pos:x.r[4],field:x.r[5],tel:x.r[1],email:x.r[6],n:0}));
      $('#xl-go').disabled=true;$('#xl-go').textContent='등록 완료';
      $('#xl-res').innerHTML=`<div class="note" style="margin-top:12px"><span>✓</span><span>성공 ${ok.length}명 · 제외 ${er+du}줄(오류 ${er}, 중복 ${du}). 같은 요청을 다시 보내도 중복 등록되지 않아요.${scope==='proj'?' 이 사업 후보로만 등록돼요.':''}</span></div>`;render()}}
  openLayer($('#p'),'#demo');if(demo)setTimeout(()=>$('#demo').click(),100)}
$('#b-xl').onclick=()=>openExcel(false);
if(location.hash==='#excel')setTimeout(()=>openExcel(true),50);
if(location.hash==='#direct')setTimeout(()=>setScope('proj'),50);
render();
</script>
</body>
</html>
