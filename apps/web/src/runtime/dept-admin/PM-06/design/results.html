<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>평가 결과 · 심사임당 사업담당자</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../super-admin/_shell.css">
<link rel="stylesheet" href="../../_steps.css">
<style>
.seg{display:inline-flex;border:1px solid var(--gray-30);border-radius:var(--radius-sm);overflow:hidden;background:var(--gray-0)}
.seg button{appearance:none;border:0;background:none;min-height:44px;padding:0 18px;font-weight:700;color:var(--text-2);cursor:pointer;border-right:1px solid var(--gray-20);font-size:var(--t-base)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--gray-5)}
.seg button[aria-pressed="true"]{background:var(--primary-5);color:var(--primary-60);box-shadow:inset 0 -3px 0 var(--primary-50)}
.seg button[aria-pressed="true"]::before{content:"✓ "}
.xl-top{display:flex;gap:8px;flex-wrap:wrap}
.xl-sum{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 8px;font-size:var(--t-base)}
.xl-tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:auto;max-height:290px}
.xl-tbl td{height:48px;padding:0 12px}
.xl-sum{margin:12px 0 8px!important}
.xl-tbl tr.r-err td:first-child{box-shadow:inset 4px 0 0 var(--danger-50)}
.xl-tbl tr.r-dup td:first-child{box-shadow:inset 4px 0 0 var(--warning-50)}
.xl-act{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.cb{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--primary-50);cursor:pointer}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.foot{display:flex;align-items:center;gap:12px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex:none}
.foot .why{margin-right:auto;color:var(--text-2);font-size:var(--t-base)}
td input.cell,td select.cell{min-height:40px;font-size:var(--t-base)}
.demo .grp{display:inline-flex;gap:6px;align-items:center;margin-right:12px}
.proj{color:var(--text-3)}
.drawer.wide{width:min(760px,100vw)}
@media print{.side,.demo,.head .acts,.steps{display:none!important}.app{display:block}.main,.body,.card{height:auto;overflow:visible;box-shadow:none}body{overflow:visible}}

.lockc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:32px}
.lockc .ico{width:72px;height:72px;border-radius:50%;background:var(--gray-10);display:grid;place-items:center;font-size:30px}
.lockc strong{font-size:var(--t-2xl)}
.prog{width:min(420px,100%);height:12px;border-radius:var(--radius-full);background:var(--gray-10);overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary-50);border-radius:var(--radius-full)}
.facts{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);flex:none}
.formula{color:var(--text-2);font-size:var(--t-base);flex:1;min-width:300px}
.rk td{height:76px}
.rk .no{font-size:var(--t-xl);font-weight:700;width:90px}
.rk .no.first{color:var(--primary-60)}
.bar{display:flex;align-items:center;gap:12px;min-width:300px}
.bar i{display:block;height:14px;border-radius:var(--radius-full);background:var(--primary-20)}
.bar i.top{background:var(--primary-50)}
.bar b{font-size:var(--t-xl);min-width:64px}
td.sc{text-align:center}
td.sc s{color:var(--text-3);text-decoration:line-through}
td.sc small{display:block;font-size:14px;color:var(--text-3);line-height:1.2}
th.sc{text-align:center}
.legend{padding:12px 20px;color:var(--text-3);font-size:var(--t-base);border-top:1px solid var(--line);flex:none}
.wm{position:relative;overflow:hidden}
.wm .wmk{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:120px;font-weight:700;letter-spacing:.1em;color:rgba(160,0,0,.10);transform:rotate(-18deg);user-select:none}
.facts .hint,.pj-act .hint{color:var(--text-3);font-size:var(--t-base)}
@media print{.tabs,.demo{display:none!important}}


/* ── 태블릿 보강 (CSS만): 1181px 이상 데스크톱에는 적용되지 않음 ── */
@media (max-width: 1180px) {
  .cb { width: 32px; height: 32px; }
}
.lockc .prog~p{display:none}
.facts .formula{display:none}
p.legend{display:none}
#acts .hint{display:none}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <button class="brand" type="button" data-href="../../PM-01/design/projects.html" aria-label="심사임당 사업 목록으로"><span class="brand-mark">심</span><span>심사임당</span></button>
  <p class="role">사업담당자</p>
  <nav aria-label="주 메뉴">
    <a href="../../PM-01/design/projects.html" aria-current="page">사업 목록</a>
    <a href="../../PM-07/design/pool.html">위원 풀</a>
  </nav>
  <div class="bottom">
    <a href="../../PM-00/design/login.html#account" data-account>내 계정</a>
    <a href="../../PM-00/design/login.html" data-logout>로그아웃</a>
  </div>
</aside>
<div class="main">
  <div class="pj-head">
    <a class="pj-back" href="../../PM-01/design/projects.html">← 사업 목록</a>
    <div class="pj-row">
      <div class="pj-title"><h1>사업</h1><span class="badge primary" id="pst">● 평가 중</span></div>
      <div class="pj-act" id="acts"></div>
    </div>
  </div>
  <nav class="steps" id="steps" aria-label="사업 진행 단계"></nav>
  <div class="body">
    <section class="card" aria-label="평가 결과" id="card"></section>
  </div>
  <details class="demo"><summary>시안 상태</summary><div class="demo-in"><span class="grp" id="presets"></span>
    <span class="muted">(가상 데이터) 전원 제출 전에는 개별 점수가 보이지 않아요 · 위원은 위원 1, 2…로만 나와요</span></div></details>

</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="scrim top" id="scrim2"></div>
<aside class="drawer" id="p" role="dialog" aria-modal="true" aria-labelledby="p-t">
  <header><h2 id="p-t"></h2><button class="x" type="button" data-close aria-label="닫기">×</button></header>
  <div class="dbody" id="p-body"></div>
  <footer id="p-foot"></footer>
</aside>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-b">
  <h2 id="dlg-t"></h2><p id="dlg-b"></p>
  <div class="acts"><button class="btn" type="button" id="dlg-cancel" data-close>취소</button><button class="btn primary" type="button" id="dlg-ok"></button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../../_ui.js"></script>
<script>
/* 가상 데이터 */
const CO=[['(가상) 가나다시스템',[88,92,85,90,94,79,91]],['(가상) 라마바소프트',[84,87,90,82,86,88,95]],['(가상) 사아자테크',[78,85,80,88,76,83,81]]];
const N=7;let st='before',SUB=5,tab=0,dlLog=[];   /* before: 제출 중 · preview: 전원 제출, 위원장 확정 전 · final: 위원장 최종 제출 */
function calc(){return CO.map(([name,s])=>{const mx=Math.max(...s),mn=Math.min(...s);const imx=s.indexOf(mx),imn=s.indexOf(mn);
  const keep=s.filter((v,i)=>i!==imx&&i!==imn);return {name,s,imx,imn,avg:keep.reduce((a,b)=>a+b,0)/keep.length}}).sort((a,b)=>b.avg-a.avg)}
const f1=x=>x.toFixed(1);
function report(){const R=calc();const rows=[['순위','업체','최종 점수(최고·최저 제외 평균)',...Array.from({length:N},(_,i)=>'위원 '+(i+1))],...R.map((r,i)=>[i+1,r.name,f1(r.avg),...r.s])];
  const t='﻿'+rows.map(r=>r.join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='평가결과_보고서.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
  dlLog.push('2026-10-28 17:05');render();toast('다운로드했어요. 누가 언제 받았는지 기록돼요')}
function render(){
  const fin=st==='final';
  renderSteps($('#steps'),['done','done','done','done','done','current']);
  $('#pst').className='badge '+(fin?'success':'primary');$('#pst').textContent=fin?'✓ 완료':'● 평가 중';
  $('#acts').innerHTML=`<span class="hint">${fin?'다운로드는 기록돼요':st==='preview'?'확정 전에는 내려받을 수 없어요':''}</span><button class="btn primary" type="button" id="dl" ${fin?'':'disabled'}>결과 보고서 다운로드</button>`;
  const card=$('#card');
  if(st==='before'){
    card.innerHTML=`<div class="lockc"><div class="ico" aria-hidden="true">🔒</div><strong>모든 위원이 제출하면 열려요</strong><p class="muted">점수 제출 <b class="tnum" style="color:var(--text-1)">${SUB}/${N}</b>명</p>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${SUB}" aria-label="점수 제출 ${SUB}/${N}"><i style="width:${SUB/N*100}%"></i></div>
    <p class="muted">사업담당자(관리자)에게는 위원별 점수가 공개되지 않아요. 제출한 사람 수만 보여요.</p></div>`;return}
  const R=calc();
  card.innerHTML=`<div class="facts">${fin?'<span class="badge success">✓ 위원장 최종 제출 2026-10-28 16:42</span>':'<span class="badge warning">미확정</span><span class="badge success">✓ 제출 7/7</span><span class="muted">위원장이 서명하고 최종 제출하면 확정돼요</span>'}<span class="formula">업체 점수 = 위원 ${N}명 점수에서 가장 높은 점수와 가장 낮은 점수를 뺀 ${N-2}명의 평균</span></div>
  ${fin?`<div class="tabs" role="tablist"><button class="tab" role="tab" id="t0" aria-selected="${tab===0}" type="button">업체 순위</button><button class="tab" role="tab" id="t1" aria-selected="${tab===1}" type="button">위원별 점수</button></div>`:''}
  <div class="tbl-wrap wm ${fin?'':'on'}" role="tabpanel">${fin&&tab===1
   ?`<table><thead><tr><th>업체</th>${Array.from({length:N},(_,i)=>`<th class="sc">위원 ${i+1}</th>`).join('')}<th class="num">최종</th></tr></thead><tbody>${R.map(r=>`<tr><td class="strong">${r.name}</td>${r.s.map((v,i)=>`<td class="sc tnum">${i===r.imx?`<s>${v}</s><small>최고 · 제외</small>`:i===r.imn?`<s>${v}</s><small>최저 · 제외</small>`:v}</td>`).join('')}<td class="num strong tnum">${f1(r.avg)}</td></tr>`).join('')}</tbody></table>`
   :`<table class="rk"><thead><tr><th>순위</th><th>업체</th><th>점수 (100점 만점)</th></tr></thead><tbody>${R.map((r,i)=>`<tr><td class="no ${i?'':'first'} tnum">${i+1}위</td><td class="strong">${r.name}</td><td><div class="bar"><i class="${i?'':'top'}" style="width:${r.avg*3.2}px"></i><b class="tnum">${f1(r.avg)}</b>${i?'':'<span class="badge primary">'+(fin?'최고 점수':'잠정 1위')+'</span>'}</div></td></tr>`).join('')}</tbody></table>`}
   ${fin?'':'<div class="wmk" aria-hidden="true">미확정</div>'}</div>
  <p class="legend">${fin?(tab===1?'취소선 점수는 평균에서 뺀 점수예요. 위원 번호는 이름과 이어지지 않아요. ':'')+'결과 보고서를 내려받으면 누가 언제 받았는지 기록돼요'+(dlLog.length?' · 마지막 다운로드 '+dlLog[dlLog.length-1]:'')+'.':'미확정 미리보기예요. 보고서는 확정 뒤에만 내려받을 수 있어요.'}</p>`;
  if(fin){$('#t0').onclick=()=>{tab=0;render();$('#t0').focus()};$('#t1').onclick=()=>{tab=1;render();$('#t1').focus()}}
  $('#dl').onclick=report}
const PRE={before:['전원 제출 전 (5/7)',()=>{st='before'}],preview:['전원 제출 · 확정 전',()=>{st='preview'}],after:['위원장 최종 제출 후',()=>{st='final'}]};
$('#presets').innerHTML=Object.entries(PRE).map(([k,v],i)=>`<button type="button" data-pre="${k}" aria-pressed="${i===0}">${v[0]}</button>`).join('');
$$('[data-pre]').forEach(b=>b.onclick=()=>{PRE[b.dataset.pre][1]();$$('[data-pre]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
const hs=location.hash.slice(1);if(PRE[hs])$$('[data-pre]').find(b=>b.dataset.pre===hs).click();else render();
</script>
</body>
</html>
