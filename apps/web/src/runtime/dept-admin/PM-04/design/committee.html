<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>평가위원 선정 · 심사임당 사업담당자</title>

<style>
.seg{display:inline-flex;border:1px solid var(--gray-30);border-radius:var(--radius-sm);overflow:hidden;background:var(--gray-0)}
.seg button{appearance:none;border:0;background:none;min-height:44px;padding:0 18px;font-weight:700;color:var(--text-2);cursor:pointer;border-right:1px solid var(--gray-20);font-size:var(--t-base)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--gray-5)}
.seg button[aria-pressed="true"]{background:var(--primary-5);color:var(--primary-60);box-shadow:inset 0 -3px 0 var(--primary-50)}
.seg button[aria-pressed="true"]::before{content:"✓ "}
.xl-top{display:flex;gap:8px;flex-wrap:wrap}
.xl-sum{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 8px;font-size:var(--t-base)}
.xl-tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:auto;max-height:290px}
.xl-tbl td{height:48px;padding:0 12px}
.xl-sum{margin:12px 0 8px!important}
.xl-tbl tr.r-err td:first-child{box-shadow:inset 4px 0 0 var(--danger-50)}
.xl-tbl tr.r-dup td:first-child{box-shadow:inset 4px 0 0 var(--warning-50)}
.xl-act{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.cb{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--primary-50);cursor:pointer}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.foot{display:flex;align-items:center;gap:12px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex:none}
.foot .why{margin-right:auto;color:var(--text-2);font-size:var(--t-base)}
td input.cell,td select.cell{min-height:40px;font-size:var(--t-base)}
.demo .grp{display:inline-flex;gap:6px;align-items:center;margin-right:12px}
.proj{color:var(--text-3)}
.drawer.wide{width:min(760px,100vw)}
@media print{.side,.demo,.head .acts,.steps{display:none!important}.app{display:block}.main,.body,.card{height:auto;overflow:visible;box-shadow:none}body{overflow:visible}}

.main{height:100vh}
.sub{list-style:none;margin:0;padding:8px 20px;display:flex;gap:8px;border-bottom:1px solid var(--line);flex:none}
.sub button{appearance:none;flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:var(--radius-sm);background:none;font-size:var(--t-base);font-weight:700;color:var(--text-3);cursor:pointer;text-align:left}
.sub button:hover{background:var(--gray-5)}
.sub .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gray-10);color:var(--text-2);font-size:14px}
.sub .done{color:var(--text-1)}
.sub .done .n{background:var(--success-5);color:var(--success-60)}
.sub .cur{color:var(--primary-60);background:var(--primary-5);box-shadow:inset 0 -3px 0 var(--primary-50)}
.sub .cur .n{background:var(--primary-50);color:#fff}
.sub .lock{font-weight:400;cursor:not-allowed}
.sub .lock .n{background:none}
.stg{flex:1;min-height:0;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:1fr 300px;gap:20px;flex:1;min-height:0}
.src{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.srcbox{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.box{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:auto;flex:1;min-height:0}
.tray{border:1px solid var(--line);border-radius:var(--radius-sm);display:flex;flex-direction:column;min-height:0;background:var(--gray-5)}
.tray header{padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px}
.tray header strong{font-size:var(--t-lg)}
.tray ul{list-style:none;margin:0;padding:0 8px 8px;overflow:auto;flex:1;min-height:0}
.tray li{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 8px;border-bottom:1px solid var(--line)}
.tray li:last-child{border:0}
.tray li .nm{font-weight:700;flex:none}
.tray li .fd{color:var(--text-3);font-size:var(--t-base);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .rm{appearance:none;border:0;background:none;width:40px;height:40px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-2);font-size:var(--t-xl);flex:none}
.tray .rm:hover{background:var(--gray-10)}
.tray .empty{padding:32px 16px;text-align:center;color:var(--text-3)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;max-width:760px}
.fgrid .full{grid-column:1/-1}
.cfg{display:flex;flex-direction:column;gap:16px;max-width:900px}
.cfg td{height:50px}
.cfg .box{overflow:visible}
.cfg-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cfg-row>b{width:104px;flex:none}
.stp{display:inline-flex;align-items:center;gap:8px}
.stp button{appearance:none;width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--gray-30);background:var(--gray-0);font-size:var(--t-xl);font-weight:700;cursor:pointer}
.stp button:hover:not(:disabled){background:var(--gray-5)}
.stp button:disabled{color:var(--gray-30);cursor:not-allowed}
.stp output{min-width:36px;text-align:center;font-weight:700;font-size:var(--t-lg)}
tr.sumrow td{font-weight:700;background:var(--gray-5);height:56px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dcard{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dcard h3{font-size:var(--t-lg);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dcard ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 8px}
.dcard li{background:var(--gray-5);border-radius:var(--radius-full);padding:4px 14px;font-size:var(--t-base);font-weight:700}
.dcard li span{font-weight:400;color:var(--text-3)}
.ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.ctr .ico{width:64px;height:64px;border-radius:50%;background:var(--primary-5);display:grid;place-items:center;font-size:var(--t-2xl)}
.call .seg button{min-height:40px;padding:0 14px}
.call .seg button[aria-pressed="true"]::before{content:"✓ "}
.call td input{min-width:200px}
.fin{display:grid;grid-template-columns:1fr 340px;gap:20px;flex:1;min-height:0}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.chk li{display:flex;gap:10px;align-items:flex-start;font-size:var(--t-base)}
.chk .ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:1px}
.chk .okc .ic{background:var(--success-5);color:var(--success-60)}
.chk .badc .ic{background:var(--danger-5);color:var(--danger-60)}
.chk b{display:block}
.side2{border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:14px;align-self:start}
.two-l{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lstcard{border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:10px}
.lstcard ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.lstcard li{display:flex;gap:10px;align-items:center;min-height:48px;border-bottom:1px solid var(--line)}
.lstcard li:last-child{border:0}
.lstcard li .nm{font-weight:700;font-size:var(--t-body)}
.stg .box td{height:44px}
.cfg td{height:42px}
.cfg th{height:38px}
tr.sumrow td{height:42px}
.cfg{gap:12px}
.stg{gap:12px;padding-top:12px}
.fin{flex:none}
.fin .src,.fin .box{flex:none;overflow:visible}
.cfg-row select{min-height:40px}
.fin .side2{align-self:start}
.chk .muted{display:block}


/* ── 태블릿 보강 (CSS만): 1181px 이상 데스크톱에는 적용되지 않음 ── */
@media (max-width: 1180px) {
  .seg button { min-height: 44px; }
  .stp button, .tray .rm { width: 44px; height: 44px; }
  .cb { width: 32px; height: 32px; }
}
@media (max-width: 1024px) {
  /* 하위 단계 탭: 한 줄로 두고 모자라면 옆으로 */
  .sub { padding: 8px 12px; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .sub::-webkit-scrollbar { display: none; }
  .sub button { flex: 1 0 auto; white-space: nowrap; padding: 0 12px; gap: 8px; }
  .sub .n { width: 26px; height: 26px; }
  .stg { padding: 12px 16px; }
  .two, .fin, .two-l, .dgrid { grid-template-columns: minmax(0, 1fr); }
  .demo .grp { flex-wrap: wrap; margin-right: 0; }
  .foot { flex-wrap: wrap; padding: 12px 16px; }
  .foot .why { flex: 1 1 240px; min-width: 0; }
  .call td input { min-width: 160px; }
}
/* 명단 확정 뒤 안내: 둘째 줄("평가 쪽에서 …")과 [상태 새로고침] 숨김 */
.stg>.note>span>br,.stg>.note>span>br+.muted,#rf{display:none}
</style>

<div class="app">
<aside class="side">
  <button class="brand" type="button" data-href="../../PM-01/design/projects.html" aria-label="심사임당 사업 목록으로"><span class="brand-mark">심</span><span>심사임당</span></button>
  <p class="role">사업담당자</p>
  <nav aria-label="주 메뉴">

  </div>
</aside>
<div class="main">
  <div class="pj-head">
    <a class="pj-back" href="../../PM-01/design/projects.html">← 사업 목록</a>
    <div class="pj-row">
      <div class="pj-title"><h1>사업</h1><span class="badge">○ 준비</span></div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="p" role="dialog" aria-modal="true" aria-labelledby="p-t">
  <header><h2 id="p-t"></h2><button class="x" type="button" data-close aria-label="닫기">×</button></header>
  <div class="dbody" id="p-body"></div>
  <footer id="p-foot"></footer>
</aside>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-b">
  <h2 id="dlg-t"></h2><p id="dlg-b"></p>
  <div class="acts"><button class="btn" type="button" id="dlg-cancel" data-close>취소</button><button class="btn primary" type="button" id="dlg-ok"></button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../../_ui.js"></script>
<script>
/* 가상 데이터. 휴대전화는 뒤 4자리만 보여요. */
const FIELDS=['시스템 구축','정보보안','데이터·AI','사업관리'];
const SUBN=['규칙','3배수 선정','연락·초청','명단 확정'];
const RAW=[['한도윤',0,'0001','수락'],['정민재',0,'0005','수락'],['임건우',0,'0009','거절'],['오수아',0,'0010','부재'],['권도현',0,'0101','미연락'],['홍라온',0,'0016','미연락'],
 ['이서연',1,'0002','수락'],['강예린',1,'0006','수락'],['신주원',1,'0011','수락'],['문시현',1,'0014','거절'],['류시우',1,'0106','미연락'],['이도윤',1,'3102','수락'],
 ['박지호',2,'0003','수락'],['윤태오',2,'0007','수락'],['배도하',2,'0012','부재'],['양지안',2,'0015','수락'],['서하린',2,'0102','미연락'],['노아린',2,'0018','미연락'],
 ['최유나',3,'0004','수락'],['이도윤',3,'3102','수락'],['조은서',3,'0013','수락']];
const DIRPOOL=[['조현우',0,'0201'],['백승아',1,'0202'],['하준서',2,'0203'],['남지율',3,'0204']];
const mkC=(r,i,src)=>({id:i,name:r[0],f:r[1],l4:r[2],st:r[3]||'미연락',memo:'',src,ex:null});
const POOLN={ok:[9,8,7,5],short:[9,4,7,5]};   /* 부서 풀 분야별 인원(같은 사람이 여러 분야에 있어도 한 번만 센 값) */
const base=()=>({mode:'POOL',cap:7,q:[2,2,2,1],saved:false,pool:'ok',err:false,drawn:false,cands:[],fst:'',ffd:'',stg:0,pick:{},ord:{},rost:'none',nid:100});
let S=base();
const need=()=>S.q.map(x=>x*3);
const sum=()=>S.q.reduce((a,b)=>a+b,0);
const tel=c=>'010-****-'+c.l4;
const reach=()=>!S.saved?0:(S.mode==='DIRECT'||S.drawn)?(S.cands.some(c=>c.st==='수락'&&!c.ex)?3:2):1;
function dl(name,rows){const t='﻿'+rows.map(r=>r.join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function drawNow(){S.pool=S.pool;const sh=need().map((n,i)=>n-POOLN[S.pool][i]);
  if(sh.some(x=>x>0)){S.err=true;render();return}
  S.err=false;S.drawn=true;S.cands=RAW.map((r,i)=>mkC([r[0],r[1],r[2],'미연락'],i,'추첨'));render();toast('분야별 3배수 '+S.cands.length+'명을 뽑았어요')}
function render(){
  renderSteps($('#steps'),['done','done','done','current','locked','locked']);
  const R=reach();
  $('#sub').innerHTML=SUBN.map((t,i)=>{const cls=i===S.stg?'cur':i<R||(i===3&&R>=3&&S.rost!=='none')?'done':i>R?'lock':'';
    return `<button type="button" class="${cls}" data-i="${i}" ${i===S.stg?'aria-current="step"':''} ${i>R?'aria-disabled="true"':''}><span class="n" aria-hidden="true">${i>R?'🔒':i<S.stg&&i<R?'✓':i+1}</span><span>${t}</span></button>`}).join('');
  $$('#sub button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i>R){toast('앞 단계를 먼저 끝내 주세요');return}S.stg=i;render()});
  [stg1,stg2,stg3,stg4][S.stg]();
}
/* ① 규칙 (DRAW-01) */
function stg1(){const empty=S.mode==='POOL'&&S.q.some((q,i)=>q>0&&POOLN.ok[i]===0),ok=sum()===S.cap&&!empty,lk=S.drawn;
  $('#stage').innerHTML=`<div class="stg"><div class="cfg">
   <div class="cfg-row"><b>선정 방식</b><div class="seg" role="group" aria-label="선정 방식" id="mode"><button type="button" data-m="POOL" aria-pressed="${S.mode==='POOL'}" ${lk?'disabled':''}>풀에서 추첨 (POOL)</button><button type="button" data-m="DIRECT" aria-pressed="${S.mode==='DIRECT'}" ${lk?'disabled':''}>직접 선정 (DIRECT)</button></div></div>
   <div class="cfg-row"><b>정원</b><div class="stp"><button type="button" id="cm" aria-label="정원 줄이기" ${S.cap<=7||lk?'disabled':''}>−</button><output>${S.cap}</output><button type="button" id="cp" aria-label="정원 늘리기" ${S.cap>=9||lk?'disabled':''}>＋</button><span class="muted">명 (7~9명)</span></div></div>
   <div class="box"><table><thead><tr><th>분야</th><th class="num">본위원 인원</th></tr></thead><tbody>${FIELDS.map((f,i)=>`<tr${S.mode==='POOL'&&POOLN.ok[i]===0?' style="opacity:.55"':''}><td class="strong">${f}${S.mode==='POOL'&&POOLN.ok[i]===0?' <span class="badge">후보 0명 · 선택 불가</span>':''}</td><td class="num"><div class="stp" style="justify-content:flex-end"><button type="button" data-d="-1" data-i="${i}" aria-label="${f} 줄이기" ${S.q[i]<=0||lk?'disabled':''}>−</button><output>${S.q[i]}</output><button type="button" data-d="1" data-i="${i}" aria-label="${f} 늘리기" ${lk||S.mode==='POOL'&&POOLN.ok[i]===0?'disabled':''}>＋</button></div></td></tr>`).join('')}
   <tr class="sumrow"><td>합계</td><td class="num tnum ${ok?'':'err'}" style="justify-content:flex-end">${sum()} / ${S.cap}명</td></tr></tbody></table></div>
   ${sum()===S.cap?'':`<p class="err" role="alert">분야별 인원의 합이 정원(${S.cap}명)과 달라요. 맞춰 주세요.</p>`}
   ${empty?'<p class="err" role="alert">후보가 0명인 분야의 인원을 0명으로 줄여 주세요.</p>':''}
   ${S.mode==='DIRECT'?'<div class="note"><span>i</span><span>직접 선정은 추첨하지 않아요. [3배수 무작위 선정] 버튼이 숨겨지고, ③ 연락·초청에서 후보를 직접 넣어요.</span></div>':'<div class="note"><span>i</span><span>풀에서 추첨하면 분야별로 정원의 3배수를 뽑아요. 한 사람이 여러 분야에 있어도 한 번만 배정돼요.</span></div>'}
   ${lk?'<div class="note warn"><span>↺</span><span>추첨 결과를 취소하면 명단 확정 전까지 방식·정원·분야별 인원을 다시 조정할 수 있어요.</span></div>':''}</div></div>`;
  $$('#mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.saved=false;render()});
  $('#cm').onclick=()=>{S.cap--;S.saved=false;render()};$('#cp').onclick=()=>{S.cap++;S.saved=false;render()};
  $$('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,d=+b.dataset.d;if(d>0&&S.mode==='POOL'&&POOLN.ok[i]===0)return;S.q[i]+=d;S.saved=false;render()});
  $('#foot').innerHTML=`<span class="why">${S.saved?'✓ 저장했어요 · 규칙 '+S.mode+' · 정원 '+S.cap+'명':'바꾼 뒤에는 [저장]을 눌러 주세요'}</span><button class="btn ${S.saved?'':'primary'}" type="button" id="save" ${ok&&!lk?'':'disabled'}>저장</button>${S.saved?'<button class="btn primary" type="button" id="nx" '+(empty?'disabled':'')+'>다음: '+(S.mode==='DIRECT'?'3배수 선정 안내':'3배수 선정')+'</button>':''}`;
  $('#save').onclick=()=>{S.saved=true;render();toast('규칙을 저장했어요')};$('#nx')&&($('#nx').onclick=()=>{S.stg=1;render()})}
/* ② 3배수 선정 (DRAW-02, DRAW-03) */
function stg2(){

   <p class="muted">부족한 분야가 하나라도 있으면 일부만 뽑지 않고 <b>전체를 멈춰요</b>. 한 사람은 한 분야에만 배정돼요.</p>`}

   ${selectedFields.length?`<div class="dgrid">${selectedFields.map(field=>`<div class="dcard"><h3>${field.name} <span class="badge">${field.members.length}명</span></h3><ul>${field.members.map(c=>`<li>${h(c.name)} <span>…${c.l4}</span></li>`).join('')}</ul></div>`).join('')}</div>`:'<p class="muted">선정된 위원이 없습니다.</p>'}`}

  $$('[data-memo]').forEach(s=>s.onchange=()=>{S.cands.find(c=>c.id==s.dataset.memo).memo=s.value;toast('메모를 저장했어요')});
  $$('[data-ex]').forEach(b=>b.onclick=()=>exclude(+b.dataset.ex));

     <td><select class="cell" data-pk="${c.id}" aria-label="${h(c.name)} 지정"><option value="">고르지 않음</option><option ${S.pick[c.id]==='본'?'selected':''} value="본">본위원</option><option ${S.pick[c.id]==='예비'?'selected':''} value="예비">예비위원</option></select></td>

   <div class="side2"><strong>확정 전 점검</strong><ul class="chk">${C.map(x=>`<li class="${x.ok?'okc':'badc'}"><span class="ic">${x.ok?'✓':'!'}</span><span><b>${x.t}</b><span class="muted">${x.s}</span></span></li>`).join('')}</ul>
   ${cf.length?`<div class="note bad" role="alert"><span>!</span><span><b>같은 이름·뒤4자리 위원이 있어 로그인이 겹쳐요</b><br>${cf.map(a=>a[0].name+' (…'+a[0].l4+') '+a.length+'명: '+a.map(c=>FIELDS[c.f]).join('·')).join('<br>')}<br>한 명만 고르거나 다른 후보로 바꿔 주세요.</span></div>`:''}</div></div></div>`;
