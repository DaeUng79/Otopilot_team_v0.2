<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참석 확인</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../_eval.css">
<style>
  .back { height: 100%; display: grid; place-items: center; color: var(--text-3); }
  .back-doc { width: 560px; height: 78%; background: var(--gray-0); border-radius: var(--radius-sm); box-shadow: var(--shadow-1); }
  .when { font-size: 17px; color: var(--text-2); background: var(--gray-5); border-radius: var(--radius-sm); padding: 12px 16px; }
  .when b { color: var(--text-1); }
  .agree { display: flex; flex-direction: column; gap: 4px; }
  .chk { display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 18px; font-weight: 700; cursor: pointer; }
  .chk input { width: 26px; height: 26px; accent-color: var(--primary-50); flex: none; cursor: pointer; }
  .more { appearance: none; border: 0; background: none; cursor: pointer; font-size: 16px; color: var(--primary-60); text-decoration: underline; text-underline-offset: 3px; padding: 0 0 0 38px; min-height: 36px; text-align: left; align-self: flex-start; }
  .terms { margin: 4px 0 0 38px; padding: 12px 16px; background: var(--gray-5); border-radius: var(--radius-sm); font-size: 16px; color: var(--text-2); }
  .terms dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; }
  .terms dt { font-weight: 700; color: var(--text-1); }
  .terms dd { margin: 0; }
  .ver { font-size: 16px; color: var(--text-3); }
  .ver b { color: var(--text-1); }
  .hint { font-size: 16px; color: var(--text-3); text-align: center; min-height: 24px; }
  .refuse { display: flex; flex-direction: column; gap: 20px; }
  .refuse .ev-note { font-size: 17px; }
  [hidden] { display: none !important; }

/* ── 태블릿 보강 (CSS만): 1181px 이상 데스크톱에는 적용되지 않음 ── */
@media (max-width: 1180px) {
  .chk input { width: 40px; height: 40px; }
  .chk { min-height: 52px; }
  .more { min-height: 44px; }
}
#ask .ver{display:none}
.evc{display:none}
</style>
</head>
<body>
<div class="ev-app">
  <header id="hd"></header>
  <div class="ev-main" id="main"><div class="back" aria-hidden="true"><div class="back-doc"></div></div></div>
</div>

<div class="ev-scrim" id="scrim">
  <div class="ev-modal" role="dialog" aria-modal="true" aria-labelledby="ttl">
    <div id="ask" class="refuse">
      <p class="ev-note info" id="reserveNote" hidden>예비위원이에요. 참석을 확인해 두면 자리가 날 때 담당자가 연락해요.</p>
      <p class="ver"><b>참석 확인</b></p>
      <h2 id="ttl">○○ 사업<br>평가위원으로 참석하시겠습니까?</h2>
      <p class="when"><b>평가일</b> 담당자 확인 필요 · <b>장소</b> 담당자 확인 필요</p>
      <div class="agree">
        <label class="chk"><input type="checkbox" id="agree" aria-describedby="hint"> 개인정보 수집·이용에 동의합니다 <span style="font-weight:400;color:var(--text-3)"></span></label>
        <button type="button" class="more" id="more" aria-expanded="false" aria-controls="terms">동의 내용 보기</button>
        <div class="terms" id="terms" hidden>
          <dl>
            <dt>기록</dt><dd>동의 내용과 시각을 저장할 때 함께 기록</dd>
            <dt>항목</dt><dd>이름, 휴대전화 뒤 4자리, 평가 점수와 의견</dd>
            <dt>쓰는 곳</dt><dd>평가위원 확인, 평가 진행, 결과 계산</dd>
            <dt>보관</dt><dd>평가가 끝나고 담당자가 확인한 뒤 폐기</dd>
          </dl>
        </div>
      </div>
      <div class="ev-modal-actions">
        <button type="button" class="ev-btn" id="yes" disabled>참석할게요</button>
        <p class="hint" id="hint" aria-live="polite">동의에 체크하면 눌러져요</p>
        <button type="button" class="ev-btn text" id="no">참석이 어려워요</button>
      </div>
    </div>
    <div id="refuse" class="refuse" hidden>
      <h2>참석이 어려우시군요</h2>
      <p class="ev-note">사업 담당자에게 알려 주세요. 담당자가 확인한 뒤 예비위원에게 연락해요.<br><b>담당자 연락처</b></p>
      <button type="button" class="ev-btn ghost" id="back">돌아가기</button>
    </div>
  </div>
</div>

<details class="ev-demo" role="group" aria-label="시안 전환"><summary>시안 상태</summary><div class="ev-demo-in"><b>위원 구분</b> <span class="ev-seg" id="seg">
    <button type="button" data-r="0" aria-pressed="true">위원</button>
    <button type="button" data-r="1" aria-pressed="false">예비위원</button>
  </span>
</div></details>

<script src="../../_eval.js"></script>
<script>
(function () {
  EvalShell.setReserve(false);
  EvalShell.mount(document.getElementById('hd'), { active: null });
  var $ = function (i) { return document.getElementById(i); };
  var agree = $('agree'), yes = $('yes');
  agree.addEventListener('change', function () {
    yes.disabled = !agree.checked;
    $('hint').textContent = agree.checked ? '' : '동의에 체크하면 눌러져요';
  });
  $('more').addEventListener('click', function () {
    var open = $('terms').hidden; $('terms').hidden = !open;
    this.setAttribute('aria-expanded', String(open)); this.textContent = open ? '동의 내용 접기' : '동의 내용 보기';
  });
  yes.addEventListener('click', function () {
    yes.disabled = true;
    EvalShell.storage.set('ev.attend', '1');
    EvalShell.toast('참석이 확인됐어요. 제안요청서로 이동해요', 1800);
    setTimeout(function () { location.href = '../../EV-03/design/rfp.html'; }, 1400);
  });
  $('no').addEventListener('click', function () { $('ask').hidden = true; $('refuse').hidden = false; $('back').focus(); });
  $('back').addEventListener('click', function () { $('refuse').hidden = true; $('ask').hidden = false; $('no').focus(); });
  $('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var r = b.dataset.r === '1';
    [].forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    $('reserveNote').hidden = !r; EvalShell.setReserve(r);
  });
  // 팝업 안에서만 Tab 이 돌게 한다
  $('scrim').addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var f = [].filter.call(this.querySelectorAll('button,input,a[href]'), function (x) { return !x.disabled && x.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  agree.focus();
})();
</script>
</body>
</html>
