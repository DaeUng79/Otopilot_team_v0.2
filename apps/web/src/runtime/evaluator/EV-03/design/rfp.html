<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제안요청서 보기 · 심사임당</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/fonts/pretendard-gov/pretendard-gov.css">
<link rel="stylesheet" href="../../_eval.css">
<style>
.cp-sl-scrim{position:fixed;inset:0;background:rgb(19 20 22/.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.cp-sl-scrim.on{opacity:1;pointer-events:auto}
.cp-sl{position:fixed;top:0;right:0;bottom:0;width:min(860px,72vw);z-index:55;background:var(--gray-5);box-shadow:var(--shadow-5);transform:translateX(104%);transition:transform .28s var(--ease);display:flex;flex-direction:column}
.cp-sl.on{transform:none}
.cp-sl-hd{flex:none;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px 0 24px;background:var(--gray-0);border-bottom:1px solid var(--line)}
.cp-sl-hd b{font-size:18px}.cp-sl-hd .sp{flex:1}
.cp-sl-bd{flex:1;min-height:0;position:relative}.cp-rd{position:absolute;inset:0}
.cp-sl .evr-top{display:none}
@media(max-width:1024px){.cp-sl{width:min(860px,94vw)}}
@media(max-width:600px){.cp-sl{width:100vw}}
@media(prefers-reduced-motion:reduce){.cp-sl,.cp-sl-scrim{transition:none}}
</style>
</head>
<body>
<div class="ev-app">
  <header id="hd" class="ev-hd"></header>
  <main class="ev-main"><div id="reader" class="evr"></div></main>
</div>
<div class="cp-sl-scrim" id="sl-scrim"></div>
<aside class="cp-sl" id="sl" role="dialog" aria-modal="true" aria-label="제안서 해당 쪽" aria-hidden="true">
  <div class="cp-sl-hd"><b id="sl-t">제안서</b><span class="sp"></span><button type="button" class="ev-btn text sm" id="sl-x">닫기</button></div>
  <div class="cp-sl-bd" id="sl-bd"></div>
</aside>
<script src="../../_eval.js"></script>
<script>
(function () {
  EvalShell.mount(document.getElementById('hd'), { active: 'rfp' });
  var toc = [
    { t: '1. 사업 개요', page: 3 },
    { t: '1-1. 추진 배경', page: 3, lv: 2 },
    { t: '1-2. 사업 범위', page: 5, lv: 2 },
    { t: '2. 현황과 요구사항', page: 8 },
    { t: '2-1. 현재 업무 현황', page: 8, lv: 2 },
    { t: '2-2. 기능 요구사항', page: 12, lv: 2 },
    { t: '3. 사업 수행 조건', page: 19 },
    { t: '4. 제안서 작성 안내', page: 25 },
    { t: '5. 평가 방법', page: 29, seen: false },
    { t: '6. 계약 조건', page: 33 },
    { t: '붙임 1. 서식 모음', page: 36 },
    { t: '붙임 2. 용어 설명', seen: false }
  ];
  EvalReader.mount(document.getElementById('reader'), {
    title: '(가상) ○○ 사업 제안요청서',
    pages: 40,
    toc: toc,
    demo: { cover: { title: '(가상) ○○ 사업 제안요청서', lines: ['2026년 10월', '(가상) ○○시 정보화담당관'] } },
    note: '평가 시작 때 고정된 버전이에요 · "확인 필요" 목차는 쪽 연결을 확인하는 중이에요',
    actions: [{ label: '원본 내려받기', onClick: function () { EvalShell.toast('시안이에요. 실제로는 원본 파일이 내려받아져요'); } }]
  });
})();
</script>
</body>
</html>
