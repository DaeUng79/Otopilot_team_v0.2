<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제안서 · 심사임당</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../_eval.css">
<style>
/* 이 화면만 쓰는 스타일 (pp- 접두어) */
.pp { position: absolute; inset: 0; display: flex; flex-direction: column; }
.pp-bar { flex: none; height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--gray-0); border-bottom: 1px solid var(--line); }
.pp-vs { display: inline-flex; gap: 6px; }
.pp-v { appearance: none; border: 1px solid var(--gray-20); background: var(--gray-0); border-radius: var(--radius-sm); padding: 0 20px; min-height: 40px; font-size: 17px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.pp-v:hover { background: var(--gray-5); }
.pp-v[aria-selected="true"] { border-color: var(--primary-50); background: var(--primary-5); color: var(--primary-60); font-weight: 700; box-shadow: inset 0 0 0 1px var(--primary-50); }
.pp-v small { font-size: 14px; font-weight: 400; color: var(--text-3); }
.pp-v[aria-selected="true"] small { color: var(--primary-70); }
.pp-sub { margin-left: auto; display: inline-flex; border: 1px solid var(--gray-30); border-radius: var(--radius-sm); padding: 2px; gap: 2px; background: var(--gray-0); }
.pp-sub a, .pp-sub span { font-size: 16px; color: var(--text-2); padding: 4px 16px; min-height: 36px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; text-decoration: none; }
.pp-sub a:hover { color: var(--text-1); background: var(--gray-5); }
.pp-sub span[aria-current="page"] { background: var(--primary-5); color: var(--primary-60); font-weight: 700; box-shadow: inset 0 0 0 1px var(--primary-20); }
.pp-body { flex: 1; min-height: 0; position: relative; }
.pp-rd { position: absolute; inset: 0; }

/* ── 태블릿 보강 (CSS만): 1181px 이상 데스크톱에는 적용되지 않음 ── */
@media (max-width: 1180px) {
  .pp-v { min-height: 44px; }
  .pp-sub a, .pp-sub span { min-height: 44px; }
}
@media (max-width: 1024px) {
  .pp-bar { padding: 0 16px; gap: 10px; }
  .pp-v { padding: 0 14px; }
}
</style>
</head>
<body>
<div class="ev-app">
  <header id="hd"></header>
  <main class="ev-main">
    <div class="pp">
      <div class="pp-bar">
        <div class="pp-vs" role="tablist" aria-label="업체 고르기" id="vs"></div>
        <nav class="pp-sub" aria-label="제안서 보는 방식"><span aria-current="page">업체별</span><a href="../../EV-05/design/compare.html">항목별 비교</a></nav>
      </div>
      <div class="pp-body" id="body"></div>
    </div>
  </main>
</div>

<script src="proposals-data.js"></script>
<script src="../../_eval.js"></script>
<script>
(function () {
  var D = window.PROPOSAL_DATA, V = ['A', 'B', 'C'];
  EvalShell.mount(document.getElementById('hd'), { active: 'proposals' });
  var q = new URLSearchParams(location.search), cur = V.indexOf(q.get('v')) >= 0 ? q.get('v') : 'A';
  var readers = {}, vs = document.getElementById('vs'), body = document.getElementById('body');

  function toc(v) {
    var out = [];
    D.VENDORS[v].toc.forEach(function (c) {
      out.push({ t: c.title, page: c.page, lv: 1 });
      c.children.forEach(function (k) { out.push({ t: k.title, page: k.page, lv: 2, seen: !(v === 'C' && k.title.indexOf('물리 구성') >= 0) }); });
    });
    return out;
  }
  V.forEach(function (v) {
    var w = document.createElement('div'); w.className = 'pp-rd'; w.id = 'rd-' + v; w.hidden = v !== cur; body.appendChild(w);
    var d = D.VENDORS[v], el = document.createElement('div'); w.appendChild(el);
    readers[v] = EvalReader.mount(el, {
      title: d.name + ' 제안서',
      toc: toc(v),
      pages: d.pages.map(function (p) {
        return p.n === 1 ? { cover: true, t: d.name + ' 제안서', p: p.lines.slice(1) } : { t: p.section.replace(/^[\d.]+\s/, ''), p: p.lines, sec: p.chapter };
      }),
      note: '평가 시작 때 고정된 제안서예요 · A사 표시는 화면용이에요 · 파일 안의 회사명은 지워지지 않을 수 있어요',
      actions: [{ label: '원본 내려받기', onClick: function () { EvalShell.toast('A사 표시는 화면용이에요 · 파일 안의 회사명은 지워지지 않을 수 있어요', 4000); } }],
      startPage: v === cur && +q.get('p') ? +q.get('p') : 1
    });
  });

  vs.innerHTML = V.map(function (v) { return '<button type="button" class="pp-v" role="tab" data-v="' + v + '" aria-selected="' + (v === cur) + '">' + D.NAME[v] + '<small>' + D.VENDORS[v].total + '쪽</small></button>'; }).join('');
  function show(v) {
    cur = v;
    V.forEach(function (x) { document.getElementById('rd-' + x).hidden = x !== v; });
    [].forEach.call(vs.children, function (b) { b.setAttribute('aria-selected', String(b.dataset.v === v)); });
    try { history.replaceState(null, '', '?v=' + v); } catch (e) {}
  }
  vs.addEventListener('click', function (e) { var b = e.target.closest('[data-v]'); if (b) show(b.dataset.v); });
  /* 업체 바꾸기: 키보드 [ ] 도 허용 안 함 (← → 는 쪽 넘기기) */
  window.__pp = { readers: readers, show: show };
})();
</script>
</body>
</html>
