<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>평가위원 로그인</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../_eval.css">
<style>
  body { background: var(--gray-5); }
  .ev-mark { position: fixed; top: 16px; left: 24px; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 24px 96px; }
  .card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px; }
  .head { text-align: center; display: flex; flex-direction: column; gap: 8px; }
  .kick { font-size: 17px; color: var(--text-3); }
  h1 { font-size: 30px; line-height: 1.35; }
  .sub { font-size: 17px; color: var(--text-2); }
  form { display: flex; flex-direction: column; gap: 20px; }
  .msg { min-height: 0; }
  .msg:empty { display: none; }
  .help { text-align: center; font-size: 16px; color: var(--text-3); }
</style>
</head>
<body>
<a class="ev-mark" href="../../../entry/design/entry.html" aria-label="심사임당 입장 화면으로"><i aria-hidden="true">심</i>심사임당</a>
<main id="main">
  <div class="card">
    <div class="head">
      <p class="kick">사업 링크로 들어오셨어요</p>
      <h1>(가상) ○○ 사업<br>평가위원 입장</h1>
      <p class="sub">이름과 휴대전화 뒤 4자리를 넣어 주세요.</p>
    </div>
    <form id="f" novalidate>
      <label class="ev-field" for="nm">이름
        <input id="nm" name="name" type="text" autocomplete="off" value="김가상" aria-describedby="msg">
      </label>
      <label class="ev-field" for="ph">휴대전화 뒤 4자리
        <input id="ph" name="phone" type="text" inputmode="numeric" maxlength="4" autocomplete="off" value="0001" aria-describedby="msg">
      </label>
      <div class="msg ev-note error" id="msg" role="alert"></div>
      <button type="submit" class="ev-btn">들어가기</button>
    </form>
    <p class="help">입장에 어려움이 있으면 사업 담당자에게 문의해 주세요.</p>
  </div>
</main>

<details class="ev-demo" role="group" aria-label="시안 전환"><summary>시안 상태</summary><div class="ev-demo-in"><b>들어가기를 누르면</b> <span class="ev-seg" id="seg">
    <button type="button" data-s="ok" aria-pressed="true">들어가요</button>
    <button type="button" data-s="mismatch" aria-pressed="false">정보 불일치</button>
    <button type="button" data-s="dup" aria-pressed="false">같은 신원 중복</button>
    <button type="button" data-s="notmember" aria-pressed="false">이 사업 위원 아님</button>
    <button type="button" data-s="nolink" aria-pressed="false">사업 링크 없음</button>
  </span>
</div></details>

<script src="../../_eval.js"></script>
<script>
(function () {
  var MSG = {
    mismatch: '이름이나 휴대전화 뒤 4자리가 맞지 않아요. 다시 확인해 주세요.',
    dup: '같은 정보의 위원이 여러 명이에요 · 담당자에게 알려 주세요',
    nolink: '사업 링크로 들어와 주세요',
    notmember: '이 사업의 평가위원으로 등록되어 있지 않아요. 사업 담당자에게 문의해 주세요.'
  };
  var state = 'ok', f = document.getElementById('f'), msg = document.getElementById('msg');
  var nm = document.getElementById('nm'), ph = document.getElementById('ph');
  function show(text, field) {
    msg.textContent = text ? '⚠ ' + text : '';
    [nm, ph].forEach(function (i) { i.setAttribute('aria-invalid', String(!!text && (!field || field === i))); });
    if (text && field) field.focus();
  }
  document.getElementById('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state = b.dataset.s;
    [].forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    show(state === 'nolink' ? MSG.nolink : '');
  });
  ph.addEventListener('input', function () { ph.value = ph.value.replace(/\D/g, ''); });
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (state === 'nolink') return show(MSG.nolink);
    if (!nm.value.trim()) return show('이름을 넣어 주세요.', nm);
    if (!/^\d{4}$/.test(ph.value)) return show('휴대전화 뒤 4자리를 숫자로 넣어 주세요.', ph);
    if (state !== 'ok') return show(MSG[state]);
    show('');
    location.href = '../../EV-01/design/attendance.html';
  });
})();
</script>
</body>
</html>
